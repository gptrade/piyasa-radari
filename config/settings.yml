# Genel ayarlar. Anahtarlar/gizli bilgiler burada DEĞİL, GitHub Secrets'ta durur.

analysis:
  enabled: true
  # Hızlı ve ucuz sınıflandırma için Haiku; daha derin yorum istersen claude-sonnet-5 yaz.
  model: claude-haiku-4-5-20251001
  # Sağlayıcı sırası: ilki kullanılamazsa (anahtar yok, kredi bitti, kota, erişim hatası) sıradakine geçilir.
  providers: [claude, gemini]
  gemini_model: gemini-3.8-flash
  # Model yoğun (503) ya da kotada (429) ise sırayla bunlar denenir
  gemini_fallback_models: [gemini-3.7-flash, gemini-flash-latest, gemini-3.5-flash-lite]
  gemini_min_interval_s: 4.5   # istekler arası en az bekleme (ücretsiz katman dakika sınırı için)
  max_items_per_run: 40        # her çalıştırmada en fazla kaç yeni habere AI yorumu yapılsın (maliyet freni)
  language: tr                 # yorumlar hangi dilde yazılsın

notify:
  telegram: true
  min_confidence: 70           # bu güvenin altındaki sinyaller bildirilmez
  only_directional: true       # nötr değerlendirmeleri bildirme
  min_materiality: medium      # low | medium | high
  anomaly: true                # habersiz hareket uyarıları Telegram'a gitsin
  technical: true              # teknik olaylar (EMA kesişimi, RSI eşiği, 52 hafta zirve/dip, hacim patlaması) Telegram'a gitsin

feed:
  keep_items: 800              # panelde tutulacak en fazla kayıt
  # Hisse başına denge: çok haber üreten hisse diğerlerini akıştan itmesin
  max_per_ticker: 90           # bir hisse en fazla bu kadar kayıt tutar (önce düşük önemli/zayıf kaynaklı olanlar atılır)
  min_per_ticker: 25           # az haber alan hisse son bu kadar kaydını eski de olsa korur
  max_age_days: 30             # bundan eski kayıt tutulmaz
  lookback_hours: 48           # ilk çalıştırmada ne kadar geriye bakılsın

sources:
  kap:
    enabled: true
    scope: watchlist           # watchlist | all  (all: tüm KAP bildirimleri panele düşer, AI sadece watchlist'e)
  sec_edgar:
    enabled: true
    forms: ["8-K", "10-Q", "10-K", "4", "SC 13D", "SC 13G", "6-K", "S-1"]   # 8-K/6-K ekleri ve 10-Q/10-K yönetim değerlendirmesi AI'a okutulur
  google_news:
    enabled: true
    max_per_stock: 8           # her hisse için her turda en fazla kaç haber
    max_per_site_query: 6      # site: aramasından hisse başına en fazla kaç haber
    # Doğrudan RSS'i olmayan siteler Google News "site:" aramasıyla izlenir (hisse başına tek sorgu, OR ile).
    # TradingView ve Fintables'ın resmi haber akışı/API'si yok ve kullanım koşulları kazımayı yasaklıyor;
    # bu yüzden yalnızca Google News'in indekslediği sayfalar (başlık + bağlantı) alınır.
    sites:
      US: [barchart.com, marketwatch.com, tradingview.com]
      BIST: [fintables.com, tradingview.com, paraanaliz.com]
    # Analist görüşü araması (hedef fiyat, tavsiye, not değişikliği); hisse başına tek sorgu
    analyst_terms:
      US: [price target, upgrade, downgrade, analyst rating]
      BIST: [hedef fiyat, tavsiye, model portföy, aracı kurum]
  marketaux:
    enabled: true              # MARKETAUX_API_TOKEN secret'ı gerekir; ücretsiz plan günde 100 istek → saatte bir, piyasa başına 1 istek
    interval_min: 60
    limit: 3                   # istek başına haber (ücretsiz planda en fazla 3)
    lookback_hours: 6
  finnhub:
    enabled: true              # FINNHUB_API_KEY secret'ı gerekir; ücretsiz plan: yalnız ABD şirket haberi, dakikada 60 istek
    interval_min: 30           # her ABD hissesi için 30 dakikada bir istek
    per_symbol: 8              # istek başına en fazla haber (en yeniler)
    lookback_hours: 24
  alphavantage:
    enabled: true              # ALPHAVANTAGE_API_KEY secret'ı gerekir; ücretsiz plan günde 25 istek → turda en fazla 1 istek
    interval_min: 60           # ABD hisseleri sırayla: her istek bir sembol
    max_per_day: 20            # günlük sınırın altında kal (elle deneme payı)
    per_request: 8
    min_relevance: 0.3         # haber bu hisseyle en az bu kadar ilgiliyse etiketlenir
    lookback_hours: 24
  broker_notes:
    enabled: true              # aracı kurum notları: haber başlıklarından (Foreks llms dosyaları + Google News); kurum siteleri okunmaz
    interval_min: 30
    # queries: Google News sorguları (varsayılanlar radar/research.py içinde)
  outlooks:
    enabled: true              # J.P. Morgan Guide to the Markets (çeyreklik), BlackRock haftalık yorum; yeni sayı çıkınca AI özeti
    interval_min: 360
  research:
    enabled: true              # research.json: kurum notları, görünümler, günlük AI sentezi (Araştırma sekmesi)
    synthesis_hours: 20        # sentez en fazla bu sıklıkta yenilenir
  central_banks:
    enabled: true              # Fed (karar + konuşmalar), ECB basın akışı; IMF ve yaptırımlar Google News konu aramasıyla
    max_fulltext: 4            # karar metinleri ve konuşmalar sayfadan alınıp AI'a verilir (önce yüksek önemli olanlar)
    per_query: 5
  gdelt:
    enabled: true              # dünya basını haber hacmi/ton alarmı (ücretsiz, anahtarsız; 5 sn'de 1 istek sınırı)
    interval_min: 60           # GitHub sunucularından GDELT sık sık hız sınırı (429) veriyor; seyrek ve az istek
    cooldown_hours: 6          # aynı tema için alarm aralığı
    min_count: 12              # son 2 saatte en az bu kadar haber yoksa alarm yok
    volume_ratio: 3            # haber payı olağanın en az bu katı
    tone_shift: 2              # ortalama ton 3 günlük ortalamadan en az bu kadar sapmış
    tone_check_ratio: 1.5      # ton yalnız hacim bu kata çıkınca çekilir (GDELT istek sınırı)
    # themes: varsayılan temalar radar/sources/global_macro.py içinde (DEFAULT_THEMES); burada değiştirilebilir
  valuation:
    enabled: true              # hisse panelinde değerleme çarpanları (Yahoo): F/K, PD/DD, FD/FAVÖK, F/S, kârlılık
    refresh_hours: 24
  documents:
    enabled: true              # izleme listesi şirketlerinin sunum/finansal rapor/faaliyet raporu (KAP) ve 8-K EX-99 (SEC) belgelerini AI'a okut
    max_per_run: 4             # turda en fazla belge (AI kotası ve süre için)
  yahoo_finance_rss:
    enabled: true
    max_per_stock: 8
  earnings_calendar:
    enabled: true              # yaklaşan bilanço tarihleri (Yahoo); bu kadar gün kala akışa düşer
    days_ahead: 7
  press_wires:
    enabled: true              # PR Newswire + GlobeNewswire; "(NASDAQ: XXX)" etiketi ya da başlıkta şirket adı
  spk:
    enabled: true              # SPK bültenleri (PDF); izleme listesindeki şirketleri arar
    max_per_run: 3
  tcmb:
    enabled: true
    feeds: ["PPK Kararları", "Basın Duyuruları", "Başkanın Konuşmaları", "Yayınlar", "Veriler"]
  evds:
    enabled: true              # EVDS_API_KEY secret'ı yoksa atlanır
    lookback_days: 400
    # Seri kodlarını EVDS'de (evds3.tcmb.gov.tr) arayıp ekleyebilirsin.
    series:
      - {code: TP.DK.USD.A.YTL, name: USD/TRY, unit: ""}
      - {code: TP.DK.EUR.A.YTL, name: EUR/TRY, unit: ""}
      - {code: TP.APIFON4, name: TCMB ağırlıklı fonlama maliyeti, unit: "%"}
  turkish_news_rss:
    enabled: true
    feeds:
      - name: AA Ekonomi
        url: https://www.aa.com.tr/tr/rss/default?cat=ekonomi
      - name: Bloomberg HT
        url: https://www.bloomberght.com/rss
      # Investing.com Türkiye resmi RSS akışları (tr.investing.com/webmaster-tools/rss)
      - {name: Investing · BİST, url: "https://tr.investing.com/rss/news_1067.rss", market: BIST}
      - {name: Investing · Şirket haberleri, url: "https://tr.investing.com/rss/news_356.rss", market: ALL}
      - {name: Investing · Insider işlemleri, url: "https://tr.investing.com/rss/news_357.rss", market: ALL}
      - {name: Investing · Analist dereceleri, url: "https://tr.investing.com/rss/news_1061.rss", market: ALL}
      - {name: Investing · Kazanç görüşmeleri, url: "https://tr.investing.com/rss/news_1063.rss", market: ALL}
      - {name: Investing · Hisse analizleri, url: "https://tr.investing.com/rss/stock.rss", market: ALL}
      - name: Dünya Gazetesi
        url: https://www.dunya.com/rss
      - {name: Ekonomim · Şirket, url: "https://www.ekonomim.net/rss/sirket-12", market: BIST}
      - {name: Ekonomim · Piyasa, url: "https://www.ekonomim.net/rss/piyasa-10", market: BIST}
      # MarketWatch (Dow Jones resmi RSS); ABD hisseleri şirket adıyla eşleşir
      - {name: MarketWatch, url: "https://feeds.content.dowjones.io/public/rss/mw_topstories", market: US, lang: en}
  reddit:
    enabled: true
    subreddits: ["stocks", "wallstreetbets", "investing"]
  stocktwits:
    enabled: true
  x_twitter:
    enabled: true              # X_BEARER_TOKEN secret'ı yoksa sessizce atlanır
    max_results_per_query: 10
  anomaly:
    enabled: true              # habersiz hareket: endeksten arındırılmış olağandışı fiyat hareketi, önemli haber/bildirim yokken
    z: 2.5                     # artık hareket, son 60 günün artık oynaklığının en az bu katı
    min_move_pct: 2.0          # ve en az bu kadar (%)
    lookback_days: 60
    news_hours: 24             # bu kadar saat içinde önemli haber/bildirim varsa "habersiz" sayılmaz
  # Türkiye resmi kaynakları (radar/sources/tr_official.py). interval_min: en sık çekim aralığı (boru hattı 15 dk'da bir çalışır)
  tuik:
    enabled: true              # turkiye.gov.tr TÜİK haber bülteni listesi; yalnız piyasayı ilgilendiren bültenler
    interval_min: 15
  bddk:
    enabled: true              # basın ve mevzuat duyuruları
    interval_min: 30
  resmi_gazete:
    enabled: true              # günün sayısı (gece 00:00'dan sonra bir kez); vergi, kambiyo, bankacılık vb. anahtar kelimeler
    interval_min: 60
  bist_announcements:
    enabled: true              # Borsa İstanbul duyuruları (endeks dönemsel değişiklikleri, pazar geçişleri, VİOP/prosedür); gong törenleri hariç
    interval_min: 15
  spk_press:
    enabled: true              # SPK basın duyuruları (bülten ayrı: spk)
    interval_min: 30
  hazine:
    enabled: true              # HMB sitesi yalnız JavaScript ile çalışıyor: ihale/borçlanma haberleri haber aramasıyla
    interval_min: 30
  bist_bulletin:
    enabled: true              # Borsa İstanbul günlük bülteni (resmi, ücretsiz gün sonu dosyası): açığa satış payı
    agm: true                  # Borsa İstanbul genel kurul listesi → Takvim
    short_mult: 2.0            # açığa satış payı 20 seans ortalamasının bu katını…
    short_min_pct: 5.0         # …ve işlem hacminin bu yüzdesini aşarsa akışa "Açığa satış artışı" düşer
    min_days: 10               # karşılaştırma için en az bu kadar seans birikmiş olmalı
  analyst:
    enabled: true              # Yahoo: not değişiklikleri (upgrade/downgrade) akışa, hedef fiyat & tavsiye dağılımı hisse paneline
    max_age_days: 3            # bundan eski not değişiklikleri akışa düşmez
    refresh_hours: 6           # analist verisi bu sıklıkla yenilenir (istek sayısını sınırlar)
  technical:
    enabled: true              # haber olmasa da teknik olayları akışa ekle (fiyat verisinden, AI kotası harcamaz)
  reports_inbox:
    enabled: true              # inbox/ klasörüne atılan PDF raporları (aracı kurum, değerleme) analiz edilir
