# Genel ayarlar. Anahtarlar/gizli bilgiler burada DEĞİL, GitHub Secrets'ta durur.

analysis:
  enabled: true
  # Hızlı ve ucuz sınıflandırma için Haiku; daha derin yorum istersen claude-sonnet-5 yaz.
  model: claude-haiku-4-5-20251001
  # Sağlayıcı sırası: ilki kullanılamazsa (anahtar yok, kredi bitti, kota, erişim hatası) sıradakine geçilir.
  providers: [claude, gemini]
  gemini_model: gemini-3.8-flash
  # Model yoğun (503) ya da kotada (429) ise sırayla bunlar denenir
  gemini_fallback_models: [gemini-3.7-flash, gemini-flash-latest, gemini-3.5-flash-lite]
  gemini_min_interval_s: 4.5   # istekler arası en az bekleme (ücretsiz katman dakika sınırı için)
  max_items_per_run: 40        # her çalıştırmada en fazla kaç yeni habere AI yorumu yapılsın (maliyet freni)
  language: tr                 # yorumlar hangi dilde yazılsın

notify:
  telegram: true
  min_confidence: 70           # bu güvenin altındaki sinyaller bildirilmez
  only_directional: true       # nötr değerlendirmeleri bildirme
  min_materiality: medium      # low | medium | high
  technical: true              # teknik olaylar (EMA kesişimi, RSI eşiği, 52 hafta zirve/dip, hacim patlaması) Telegram'a gitsin

feed:
  keep_items: 800              # panelde tutulacak en fazla kayıt
  # Hisse başına denge: çok haber üreten hisse diğerlerini akıştan itmesin
  max_per_ticker: 90           # bir hisse en fazla bu kadar kayıt tutar (önce düşük önemli/zayıf kaynaklı olanlar atılır)
  min_per_ticker: 25           # az haber alan hisse son bu kadar kaydını eski de olsa korur
  max_age_days: 30             # bundan eski kayıt tutulmaz
  lookback_hours: 48           # ilk çalıştırmada ne kadar geriye bakılsın

sources:
  kap:
    enabled: true
    scope: watchlist           # watchlist | all  (all: tüm KAP bildirimleri panele düşer, AI sadece watchlist'e)
  sec_edgar:
    enabled: true
    forms: ["8-K", "10-Q", "10-K", "4", "SC 13D", "SC 13G", "6-K", "S-1"]
  google_news:
    enabled: true
    max_per_stock: 8           # her hisse için her turda en fazla kaç haber
    max_per_site_query: 6      # site: aramasından hisse başına en fazla kaç haber
    # Doğrudan RSS'i olmayan siteler Google News "site:" aramasıyla izlenir (hisse başına tek sorgu, OR ile).
    # TradingView ve Fintables'ın resmi haber akışı/API'si yok ve kullanım koşulları kazımayı yasaklıyor;
    # bu yüzden yalnızca Google News'in indekslediği sayfalar (başlık + bağlantı) alınır.
    sites:
      US: [barchart.com, marketwatch.com, tradingview.com]
      BIST: [fintables.com, tradingview.com]
    # Analist görüşü araması (hedef fiyat, tavsiye, not değişikliği); hisse başına tek sorgu
    analyst_terms:
      US: [price target, upgrade, downgrade, analyst rating]
      BIST: [hedef fiyat, tavsiye, model portföy, aracı kurum]
  yahoo_finance_rss:
    enabled: true
    max_per_stock: 8
  earnings_calendar:
    enabled: true              # yaklaşan bilanço tarihleri (Yahoo); bu kadar gün kala akışa düşer
    days_ahead: 7
  press_wires:
    enabled: true              # PR Newswire + GlobeNewswire; "(NASDAQ: XXX)" etiketi ya da başlıkta şirket adı
  spk:
    enabled: true              # SPK bültenleri (PDF); izleme listesindeki şirketleri arar
    max_per_run: 3
  tcmb:
    enabled: true
    feeds: ["PPK Kararları", "Basın Duyuruları", "Başkanın Konuşmaları"]
  evds:
    enabled: true              # EVDS_API_KEY secret'ı yoksa atlanır
    lookback_days: 400
    # Seri kodlarını EVDS'de (evds3.tcmb.gov.tr) arayıp ekleyebilirsin.
    series:
      - {code: TP.DK.USD.A.YTL, name: USD/TRY, unit: ""}
      - {code: TP.DK.EUR.A.YTL, name: EUR/TRY, unit: ""}
      - {code: TP.APIFON4, name: TCMB ağırlıklı fonlama maliyeti, unit: "%"}
  turkish_news_rss:
    enabled: true
    feeds:
      - name: AA Ekonomi
        url: https://www.aa.com.tr/tr/rss/default?cat=ekonomi
      - name: Bloomberg HT
        url: https://www.bloomberght.com/rss
      # Investing.com Türkiye resmi RSS akışları (tr.investing.com/webmaster-tools/rss)
      - {name: Investing · BİST, url: "https://tr.investing.com/rss/news_1067.rss", market: BIST}
      - {name: Investing · Şirket haberleri, url: "https://tr.investing.com/rss/news_356.rss", market: ALL}
      - {name: Investing · Insider işlemleri, url: "https://tr.investing.com/rss/news_357.rss", market: ALL}
      - {name: Investing · Analist dereceleri, url: "https://tr.investing.com/rss/news_1061.rss", market: ALL}
      - {name: Investing · Kazanç görüşmeleri, url: "https://tr.investing.com/rss/news_1063.rss", market: ALL}
      - {name: Investing · Hisse analizleri, url: "https://tr.investing.com/rss/stock.rss", market: ALL}
      - name: Dünya Gazetesi
        url: https://www.dunya.com/rss
      # MarketWatch (Dow Jones resmi RSS); ABD hisseleri şirket adıyla eşleşir
      - {name: MarketWatch, url: "https://feeds.content.dowjones.io/public/rss/mw_topstories", market: US, lang: en}
  reddit:
    enabled: true
    subreddits: ["stocks", "wallstreetbets", "investing"]
  stocktwits:
    enabled: true
  x_twitter:
    enabled: true              # X_BEARER_TOKEN secret'ı yoksa sessizce atlanır
    max_results_per_query: 10
  analyst:
    enabled: true              # Yahoo: not değişiklikleri (upgrade/downgrade) akışa, hedef fiyat & tavsiye dağılımı hisse paneline
    max_age_days: 3            # bundan eski not değişiklikleri akışa düşmez
    refresh_hours: 6           # analist verisi bu sıklıkla yenilenir (istek sayısını sınırlar)
  technical:
    enabled: true              # haber olmasa da teknik olayları akışa ekle (fiyat verisinden, AI kotası harcamaz)
  reports_inbox:
    enabled: true              # inbox/ klasörüne atılan PDF raporları (aracı kurum, değerleme) analiz edilir
