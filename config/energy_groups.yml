# Enerji sekmesi: santral sahiplerini gruplara ve borsa kodlarına bağlar.
#
# match: şirket adının BAŞINA uyan ifadeler. Karşılaştırma Türkçe karakterler sadeleştirilerek, büyük harfle ve
#        noktalama yok sayılarak yapılır ("Aksa Enerji Uretim AŞ" = "AKSA ENERJİ ÜRETİM A.Ş."). GEM adları çoğu zaman
#        İngilizce ya da ASCII yazımlı olduğu için iki yazım da verilebilir.
# Sahiplik zincirinde (ör. Kişiler → Kazancı Holding → Aksa Enerji → Santral) santrale EN YAKIN eşleşen şirket esas
# alınır: Aksa'nın santrali Aksa Enerji'ye (AKSEN) yazılır, Kazancı Holding'e değil.
# ticker: grubun ya da şirketin borsa kodu; parent: santral şirketi borsada değilse borsadaki ortağı. kind: ozel | kamu.
# Listede olmayan sahipler kendi adlarıyla görünür (panelde "eşleşmedi" işaretli).
# exclude: Ownership Tracker'da santralin ülkesi yok (Türk şirketinin sahibi olduğu santraller alınıyor); yurt dışındaki
# santraller ada göre dışarıda bırakılır. GEM kömür/gaz santral izleyicileri eklenince ülke alanı kullanılacak.
exclude: [Ghana, Bishkek, Bukhara, Sirdaryo, Tashkent, Congo, Jizzakh, Kalecik, Powership, Talimercan, Yangiaryk,
          Ecuador, Indonesia, Mozambique, Senegal, Guyana, Iraq, Kosovo, Mali, Sudan, Lebanon, Cuba]
groups:
  # ── kamu
  - { name: EÜAŞ, kind: kamu, match: ["Elektrik Üretim A.Ş.", "Elektrik Uretim AS", "Elektrik Üretim AŞ", "Elektrik Uretim AŞ", "EÜAŞ"] }
  - { name: DSİ, kind: kamu, match: ["General Directorate of State Hydraulic Works", "Devlet Su İşleri", "DSİ"] }
  - { name: Diğer kamu, kind: kamu, match: ["Government of Türkiye", "Eti Maden"] }
  # ── borsadaki üretim şirketleri
  - { name: Aksa Enerji, ticker: AKSEN, match: ["Aksa Enerji", "Aksa Göynük"] }
  - { name: Zorlu Enerji, ticker: ZOREN, match: ["Zorlu Enerji", "Zorlu Jeotermal", "Zorlu Rüzgar", "Zorlu Doğal", "Zorlu Elektrik"] }
  - { name: Odaş Elektrik, ticker: ODAS, match: ["Odaş"] }
