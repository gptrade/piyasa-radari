# Enerji sekmesi: EPİAŞ'taki tüzel kişileri (santral şirketlerini) gruplara ve borsa kodlarına bağlar.
#
# match: şirket unvanının BAŞINA uyan ifadeler (büyük harf, Türkçe karakterli; noktalama yok sayılır).
#        Ör. "ZORLU" → "ZORLU ENERJİ ELEKTRİK ÜRETİM A.Ş.", "ZORLU JEOTERMAL ENERJİ ..." vb.
# ticker: grubun ya da şirketin kendisinin borsa kodu; parent: santral şirketi borsada değilse borsadaki ortağı.
# kind: ozel | kamu.  Listede olmayan şirketler unvanlarının ilk ayırt edici kelimesiyle otomatik gruplanır
# (panelde "otomatik" işaretli). İlk gerçek veri gelince bu liste EPİAŞ unvanlarına göre genişletilecek.
groups:
  # ── kamu
  - { name: EÜAŞ, kind: kamu, match: ["ELEKTRİK ÜRETİM A Ş", "ELEKTRİK ÜRETİM ANONİM ŞİRKETİ", "EÜAŞ"] }
  # ── borsadaki üretim şirketleri
  - { name: Aksa Enerji, ticker: AKSEN, match: ["AKSA ENERJİ", "AKSA GÖYNÜK"] }
  - { name: Zorlu Enerji, ticker: ZOREN, match: ["ZORLU ENERJİ", "ZORLU JEOTERMAL", "ZORLU RÜZGAR", "ZORLU DOĞAL"] }
  - { name: Odaş Elektrik, ticker: ODAS, match: ["ODAŞ"] }
