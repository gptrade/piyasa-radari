# Konular: (anahtar, etiket, arama terimleri)
topics:
  - { key: mrm, label: "Model riski / validasyon", terms: ["model validation", "model risk management", "model risk", "model validasyon", "model riski"] }
  - { key: irb, label: "IRB", terms: ["internal ratings-based", "IRB approach", "içsel derecelendirme"] }
  - { key: aiml, label: "AI/ML yönetişimi", terms: ["artificial intelligence", "machine learning", "AI governance", "yapay zeka"] }
  - { key: backtest, label: "Geriye dönük test", terms: ["backtesting", "back-testing", "geriye dönük test"] }
  - { key: ecl, label: "IFRS 9 / ECL", terms: ["IFRS 9", "TFRS 9", "expected credit loss", "ECL", "beklenen kredi zararı"] }
  - { key: stress, label: "Stres testi", terms: ["stress test", "stres test"] }
