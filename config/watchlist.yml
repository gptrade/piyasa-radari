# İzleme listesi. Bir hisse eklemek için aynı formatta bir satır ekle ve commit et.
# aliases: haber metninde bu hisseyi tanımak için aranacak isimler (büyük/küçük harf duyarsız).
# yahoo: fiyat verisi için Yahoo Finance sembolü (BIST için .IS eki).

bist:
