    aliases: ["VakıfBank", "Vakıfbank", "Türkiye Vakıflar Bankası"]
  - symbol: TTKOM
    name: Türk Telekom
    aliases: ["Türk Telekom", "Türk Telekomünikasyon"]
  - symbol: KLNMA
    name: Türkiye Kalkınma ve Yatırım Bankası
    aliases: ["Kalkınma ve Yatırım Bankası", "TKYB"]
  - symbol: GOZDE
    name: Gözde Girişim
    aliases: ["Gözde Girişim"]
  - symbol: GLRMK
    name: Gülermak
    aliases: ["Gülermak"]
  - symbol: ENTRA
    name: IC Enterra Yenilenebilir Enerji
    aliases: ["Enterra", "IC Enterra"]
  - symbol: A1CAP
    name: A1 Capital Yatırım
    aliases: ["A1 Capital"]
  - symbol: THYAO
    name: Türk Hava Yolları
    aliases: ["Türk Hava Yolları", "THY"]

