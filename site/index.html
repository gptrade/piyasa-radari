<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Piyasa Radarı</title>
<meta name="description" content="BIST ve ABD hisseleri için haber, bildirim, sosyal medya ve rapor akışı; Claude değerlendirmesi ve fiyat tepkisi.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230f766e'/><circle cx='16' cy='16' r='9' fill='none' stroke='white' stroke-width='2'/><circle cx='16' cy='16' r='3' fill='white'/><path d='M16 16 L24 9' stroke='white' stroke-width='2'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell">
  <aside class="side" id="side">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" class="brand-bg"/><circle cx="16" cy="16" r="9" fill="none" stroke="#fff" stroke-width="2"/><circle cx="16" cy="16" r="3" fill="#fff"/><path d="M16 16 L24 9" stroke="#fff" stroke-width="2"/></svg>
      <div><b>Piyasa Radarı</b><small>BIST · ABD haber istihbaratı</small></div>
    </div>

    <div class="seg" role="tablist" id="marketSeg">
      <button data-market="ALL" class="on">Tümü</button>
      <button data-market="BIST">BIST</button>
      <button data-market="US">ABD</button>
    </div>

    <nav class="nav" id="views">
      <p class="label">Görünüm</p>
      <button data-view="feed" class="on"><span>Akış</span><em id="cntFeed">0</em></button>
      <button data-view="signals"><span>Güçlü sinyaller</span><em id="cntSig">0</em></button>
      <button data-view="saved"><span>Kaydedilenler</span><em id="cntSaved">0</em></button>
    </nav>

    <div class="nav" id="watchBox">
      <p class="label">İzleme listesi</p>
      <div id="watch"></div>
    </div>

    <div class="nav" id="srcBox">
      <p class="label">Kaynak durumu</p>
      <div id="sources" class="sources"></div>
      <p class="meta" id="gen"></p>
    </div>
  </aside>

  <main class="main">
    <header class="bar">
      <div class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Hisse, başlık, kaynak ara…" autocomplete="off">
      </div>
      <div class="chips" id="typeChips">
        <button data-type="disclosure">Bildirim</button>
        <button data-type="news">Haber</button>
        <button data-type="social">Sosyal</button>
        <button data-type="report">Rapor</button>
      </div>
      <div class="chips" id="sentChips">
        <button data-sent="bullish" class="up">Yükseliş</button>
        <button data-sent="bearish" class="down">Düşüş</button>
        <button data-sent="neutral">Nötr</button>
      </div>
      <label class="conf">Güven ≥ <output id="confOut">0</output>
        <input id="conf" type="range" min="0" max="90" step="10" value="0">
      </label>
    </header>

    <div id="banner" class="banner" hidden></div>
    <section id="list" class="list" aria-live="polite"></section>
    <p id="empty" class="empty" hidden>Bu filtrelere uyan kayıt yok.</p>
  </main>
</div>

<template id="cardTpl">
  <article class="card">
    <div class="c-news">
      <div class="c-top"><span class="tickers"></span><span class="ago"></span><button class="save" title="Kaydet" aria-label="Kaydet"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg></button></div>
      <h2><a class="title" target="_blank" rel="noopener"></a></h2>
      <p class="desc"></p>
      <div class="c-foot"><span class="src"></span><span class="type"></span></div>
    </div>
    <div class="c-ai">
      <div class="ai-head"><span class="ai-label">Claude değerlendirmesi</span><span class="mat"></span></div>
      <div class="ai-row"><span class="sent"></span><span class="confv"></span></div>
      <p class="ai-sum"></p>
      <ul class="ai-points"></ul>
      <p class="ai-risk"></p>
      <div class="meter"><i></i></div>
      <div class="ai-foot"><span class="hor"></span><span class="cat"></span></div>
    </div>
    <div class="c-px">
      <div class="px-head"><span class="px-sym"></span><div class="px-rng"><button data-r="1G" class="on">1G</button><button data-r="1H">1H</button><button data-r="1A">1A</button></div></div>
      <div class="px-row"><b class="px-last"></b><span class="px-chg"></span></div>
      <svg class="spark" viewBox="0 0 240 70" preserveAspectRatio="none"></svg>
      <div class="react"></div>
      <p class="px-time"></p>
    </div>
  </article>
</template>

<script src="app.js"></script>
</body>
</html>
