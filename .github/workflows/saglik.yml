name: saglik

# Günlük sağlık denetimi (yalnız yönetici): veri tazeliği, içerik makullüğü, iş akışı hataları, kaynak durumu.
# Sonuç: yöneticiye Telegram özeti + saglik dalına saglik.json (sitede Kullanıcılar sayfasında, /api/health ile).
on:
  schedule:
    - cron: "23 5 * * *"          # İstanbul 08:23
  workflow_dispatch: {}
  push:
    branches: [onizleme-saglik]
    paths: ["radar/health.py", ".github/workflows/saglik.yml"]

permissions:
  contents: write
  actions: read

concurrency:
  group: saglik
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Veri dallarını getir
        run: |
          for b in data fin fin_us guc olay yontem enerji regulasyon; do
            git fetch -q --depth 1 origin "$b:refs/remotes/origin/$b" || echo "dal yok: $b"
          done

      - name: Denetle ve bildir
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          SITE_URL: ${{ vars.SITE_URL || 'https://radar.lyracube.com' }}
        run: python -m radar.health

      - name: saglik dalına kaydet
        run: |
          cd out
          git init -q -b saglik
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add saglik.json
          git commit -qm "saglik $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" saglik
