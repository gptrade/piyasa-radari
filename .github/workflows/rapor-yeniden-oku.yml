name: rapor-yeniden-oku

# Rapor kutusundaki bir raporu yeniden okutur (elle tetiklenir). Kimlik: sitedeki rapor kaydının "rapor-…" kimliği.
# Radar her turda data dalını yeniden yazdığı için betik, değişiklik kalıcı olana dek radar turlarını bekleyip tekrarlar.
on:
  workflow_dispatch:
    inputs:
      id:
        description: "Rapor kimliği (rapor-865808ab9ab867b9 gibi)"
        required: true

permissions:
  contents: write
  actions: read

jobs:
  duzelt:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Yeniden okut
        env:
          RID: ${{ inputs.id }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          cp tools/rapor_yeniden.py /tmp/r.py
          git config user.name "radar-bot"; git config user.email "radar-bot@users.noreply.github.com"
          pip install -q requests && python3 /tmp/r.py
