name: radar

on:
  schedule:
    - cron: "*/15 * * * *"        # her 15 dakikada (GitHub yoğunlukta birkaç dk geciktirebilir)
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["inbox/**", "config/**", "radar/**", "site/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HAS_RAPOR: ${{ secrets.RAPOR_REPO_TOKEN != '' }}
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Testler
        run: python -m pytest -q

      # Durum ve akış verisi, commit geçmişini şişirmemek için ayrı, tek commit'lik `data` dalında tutulur.
      - name: Önceki veriyi geri yükle
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --depth 1 origin data
            mkdir -p site/data
            git archive FETCH_HEAD | tar -x -C site/data
          fi

      # Gizli rapor kutusu: kullanıcının gizli reposu, site/ DIŞINA çekilir (Pages'e ve data dalına girmez)
      - name: Gizli rapor kutusunu çek
        if: ${{ env.HAS_RAPOR == 'true' }}
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: gptrade/piyasa-radari-raporlar
          token: ${{ secrets.RAPOR_REPO_TOKEN }}
          path: _raporlar
          persist-credentials: false

      - name: Radarı çalıştır
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Gemini yedek sağlayıcı: GEMINI_API_KEY ya da PIYASA_RADARI adlı secret
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.PIYASA_RADARI }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
          MARKETAUX_API_TOKEN: ${{ secrets.MARKETAUX_API_TOKEN }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          RAPOR_REPO_TOKEN: ${{ secrets.RAPOR_REPO_TOKEN }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python -m radar

      # Temel analiz: KAP mali tabloları (BIST-100), zaman bütçeli; hata olursa radar etkilenmez
      - name: Temel analiz verisi
        continue-on-error: true
        timeout-minutes: 6
        env:
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
        run: python -m radar.fundamentals 180

      - name: Veriyi data dalına kaydet
        run: |
          cd site/data
          git init -q -b data
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add -A
          git commit -qm "data $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
          rm -rf .git

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
