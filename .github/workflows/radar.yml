name: radar

on:
  schedule:
    - cron: "*/15 * * * *"        # her 15 dakikada (GitHub yoğunlukta birkaç dk geciktirebilir)
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["inbox/**", "config/**", "radar/**", "site/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write          # temel.yml'yi tetiklemek için

# Kuyruk kilidi yalnız veri işinde. Pages dağıtımı ayrı işte ve kendi grubunda: 10 Ekim'de github-pages
# ortamında "waiting" durumunda takılan bir dağıtım, iş akışı düzeyindeki kilit yüzünden radarı 3,5 gün durdurdu.
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: radar
      cancel-in-progress: false
    env:
      HAS_RAPOR: ${{ secrets.RAPOR_REPO_TOKEN != '' }}
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      # Bekçi: 30 dakikadan uzun süredir "waiting"/"queued" kalan eski radar çalışmalarını iptal et
      - name: Takılı çalışmaları temizle
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api="https://api.github.com/repos/${{ github.repository }}/actions"
          cutoff=$(date -u -d '-30 min' +%FT%TZ)
          for st in waiting queued pending; do
            curl -sS -H "Authorization: Bearer $GH_TOKEN" "$api/workflows/radar.yml/runs?status=$st&per_page=50" \
              | jq -r --arg c "$cutoff" --arg me "${{ github.run_id }}" '.workflow_runs[] | select(.created_at < $c and (.id|tostring) != $me) | .id'
          done | sort -u | while read -r id; do
            echo "Takılı çalışma iptal ediliyor: $id"
            curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" "$api/runs/$id/force-cancel" -o /dev/null -w "HTTP %{http_code}\n"
          done

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Testler
        run: python -m pytest -q

      # Durum ve akış verisi, commit geçmişini şişirmemek için ayrı, tek commit'lik `data` dalında tutulur.
      - name: Önceki veriyi geri yükle
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --depth 1 origin data
            mkdir -p site/data
            git archive FETCH_HEAD | tar -x -C site/data
          fi

      # Temel analiz verisi ayrı iş akışında (temel.yml) üretilir, fin dalından okunur
      - name: Temel analiz verisini geri yükle
        run: |
          rm -rf site/data/fin && mkdir -p site/data/fin
          if git ls-remote --exit-code --heads origin fin >/dev/null 2>&1; then
            echo "HAS_FIN=1" >> "$GITHUB_ENV"
            git fetch --depth 1 origin fin
            git archive FETCH_HEAD | tar -x -C site/data/fin
          elif git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --depth 1 origin data
            git archive FETCH_HEAD fin | tar -x -C site/data || true
          fi

      # Enerji kurulu güç verisi ayrı iş akışında (enerji.yml, haftalık) üretilir, enerji dalından okunur
      - name: Enerji verisini geri yükle
        run: |
          rm -rf site/data/enerji && mkdir -p site/data/enerji
          if git ls-remote --exit-code --heads origin enerji >/dev/null 2>&1; then
            git fetch --depth 1 origin enerji
            git archive FETCH_HEAD | tar -x -C site/data/enerji
          fi

      - name: Regülasyon verisini geri yükle
        run: |
          rm -rf site/data/regulasyon && mkdir -p site/data/regulasyon
          if git ls-remote --exit-code --heads origin regulasyon >/dev/null 2>&1; then
            git fetch --depth 1 origin regulasyon
            git archive FETCH_HEAD | tar -x -C site/data/regulasyon
          fi

      # Olay karnesi (olay.yml, saatlik) olay dalında; panel yalnız karne.json'u okur (Parquet dosyaları yayımlanmaz)
      - name: Olay karnesini geri yükle
        run: |
          rm -rf site/data/olay && mkdir -p site/data/olay
          if git ls-remote --exit-code --heads origin olay >/dev/null 2>&1; then
            git fetch --depth 1 origin olay
            git archive FETCH_HEAD karne.json sigx.json | tar -x -C site/data/olay || git archive FETCH_HEAD karne.json | tar -x -C site/data/olay || true
          fi

      # Gizli rapor kutusu: kullanıcının gizli reposu, site/ DIŞINA çekilir (Pages'e ve data dalına girmez)
      - name: Gizli rapor kutusunu çek
        if: ${{ env.HAS_RAPOR == 'true' }}
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: gptrade/piyasa-radari-raporlar
          token: ${{ secrets.RAPOR_REPO_TOKEN }}
          path: _raporlar
          persist-credentials: false

      - name: Radarı çalıştır
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Gemini yedek sağlayıcı: GEMINI_API_KEY ya da PIYASA_RADARI adlı secret
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.PIYASA_RADARI }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
          MARKETAUX_API_TOKEN: ${{ secrets.MARKETAUX_API_TOKEN }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          RAPOR_REPO_TOKEN: ${{ secrets.RAPOR_REPO_TOKEN }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python -m radar

      - name: Veriyi data dalına kaydet
        run: |
          cd site/data
          git init -q -b data
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          # temel analiz (fin) ve enerji verisi kendi dallarında; o dal oluşana dek (geçiş) data dalında kalır
          if [ "${HAS_FIN:-}" = "1" ]; then git add -A -- . ':!fin' ':!enerji' ':!regulasyon' ':!olay'; else git add -A -- . ':!enerji' ':!regulasyon' ':!olay'; fi
          git commit -qm "data $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
          rm -rf .git

      # Temel analiz iş akışını tetikle: GitHub'ın 10 dakikalık zamanlayıcısı yeni iş akışlarında saatlerce
      # gecikebiliyor; radar her çalıştığında (cron-job.org ile 15 dakikada bir) temel analiz de bir tur ilerler.
      - name: Temel analizi tetikle
        continue-on-error: true
        run: |
          curl -sS -X POST -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/temel.yml/dispatches" \
            -d '{"ref":"main"}' -o /dev/null -w "temel.yml tetiklendi: HTTP %{http_code}\n"

      # Olay veritabanı: GitHub'ın saatlik zamanlayıcısı pratikte 4–6 saatte bir çalışıyor; radar saatin ilk
      # çeyreğindeki turunda tetikler (olay.yml sıraya alır, aynı anda iki tur çalışmaz).
      - name: Olay veritabanını tetikle
        continue-on-error: true
        run: |
          [ "$(date -u +%M)" -lt 15 ] || { echo "bu tur değil"; exit 0; }
          curl -sS -X POST -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/olay.yml/dispatches" \
            -d '{"ref":"main"}' -o /dev/null -w "olay.yml tetiklendi: HTTP %{http_code}\n"

      # Kapalı grup sitesi (Cloudflare Pages + Cloudflare Access). Secret'lar tanımlı değilse atlanır;
      # geçiş süresince GitHub Pages yayını da sürer.
      - name: Cloudflare Pages'e yükle
        if: ${{ env.HAS_CF == 'true' }}
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          preCommands: wrangler pages project create piyasa-radari --production-branch=main || true
          command: pages deploy site --project-name=piyasa-radari --branch=main --commit-dirty=true

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Dağıtım ayrı iş: takılırsa sonraki turun dağıtımı onu iptal eder, veri işi hiç beklemez
  deploy:
    needs: run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: radar-pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
