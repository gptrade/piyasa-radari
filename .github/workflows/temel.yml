name: temel

# Temel analiz verisi (KAP mali tabloları, kar payı, TÜFE, fiyat) radardan ayrı; radar her turda tetikler.
# KAP rapor indirme sınırı (~5 dakikada 10) nedeniyle bir tur en fazla 9 rapor indirir; kuyruk doluyken
# aynı çalıştırmada 6+ dakika arayla 3 tur atılır (~27 rapor / ~16 dk).
# Veri ayrı, tek commit'lik `fin` dalında tutulur; radar iş akışı yayımlarken bu daldan okur.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: temel
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Önceki veriyi geri yükle
        run: |
          mkdir -p site/data/fin
          if git ls-remote --exit-code --heads origin fin >/dev/null 2>&1; then
            git fetch --depth 1 origin fin
            git archive FETCH_HEAD | tar -x -C site/data/fin
          elif git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            # ilk geçiş: veri daha önce data dalının fin/ klasöründeydi
            git fetch --depth 1 origin data
            git archive FETCH_HEAD fin | tar -x -C site/data || true
          fi

      - name: Temel analiz verisi
        timeout-minutes: 21
        env:
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
        run: python -m radar.fundamentals 240 3 390

      - name: Banka faiz duyarlılığı
        continue-on-error: true
        timeout-minutes: 3
        env:
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
        run: python -m radar.fundamentals.bankrate

      - name: Veriyi fin dalına kaydet
        if: always()
        run: |
          cd site/data/fin
          [ -f _state.json ] || exit 0
          git init -q -b fin
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add -A
          git commit -qm "fin $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" fin
          rm -rf .git
