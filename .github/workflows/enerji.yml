name: enerji

# Enerji sekmesi: santral envanteri ve sahiplik Global Energy Monitor'den (config/enerji/gem_tr.json, tools/gem_import.py);
# EPİAŞ'tan YEKDEM lisanslı/lisanssız kurulu güç bağlamı (EPIAS_USERNAME / EPIAS_PASSWORD; yoksa atlanır).
# Veri tek commit'lik `enerji` dalında tutulur, radar iş akışı yayımlarken bu daldan okur.
on:
  schedule:
    - cron: "17 4 * * *"          # her gün: KAP enerji bildirimleri; GEM aynı kalır
  workflow_dispatch: {}
  # GEM aktarımı, grup eşleştirmesi ya da kod değişince yeniden üret
  push:
    branches: [main]
    paths: ["radar/energy.py", "config/energy_groups.yml", "config/enerji/**", ".github/workflows/enerji.yml"]

permissions:
  contents: write

concurrency:
  group: enerji
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Önceki veriyi geri yükle
        run: |
          mkdir -p site/data/enerji
          if git ls-remote --exit-code --heads origin enerji >/dev/null 2>&1; then
            git fetch --depth 1 origin enerji
            git archive FETCH_HEAD | tar -x -C site/data/enerji
          fi

      - name: Şirket listesi (KAP üye kimlikleri, fin dalından)
        run: |
          mkdir -p site/data/fin
          if git ls-remote --exit-code --heads origin fin >/dev/null 2>&1; then
            git fetch --depth 1 origin fin
            git archive FETCH_HEAD _universe.json | tar -x -C site/data/fin || true
          fi

      - name: Kurulu güç envanteri
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.PIYASA_RADARI }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EPIAS_USERNAME: ${{ secrets.EPIAS_USERNAME }}
          EPIAS_PASSWORD: ${{ secrets.EPIAS_PASSWORD }}
        run: python -m radar.energy

      - name: Veriyi enerji dalına kaydet
        run: |
          cd site/data/enerji
          [ -f kurulu_guc.json ] || exit 0
          git init -q -b enerji
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add -A
          git commit -qm "enerji $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" enerji
          rm -rf .git
