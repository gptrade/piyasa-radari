name: enerji

# Enerji sekmesi: EPİAŞ Şeffaflık Platformu'ndan şirket bazında kurulu güç (EAK) ve yeni devreye alınan santraller.
# Haftalık; veri tek commit'lik `enerji` dalında tutulur, radar iş akışı yayımlarken bu daldan okur.
# EPIAS_USERNAME / EPIAS_PASSWORD secret'ları yoksa hiçbir şey yapmadan biter.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: enerji
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Önceki veriyi geri yükle
        run: |
          mkdir -p site/data/enerji
          if git ls-remote --exit-code --heads origin enerji >/dev/null 2>&1; then
            git fetch --depth 1 origin enerji
            git archive FETCH_HEAD | tar -x -C site/data/enerji
          fi

      - name: Kurulu güç envanteri
        env:
          EPIAS_USERNAME: ${{ secrets.EPIAS_USERNAME }}
          EPIAS_PASSWORD: ${{ secrets.EPIAS_PASSWORD }}
        run: python -m radar.energy

      - name: Veriyi enerji dalına kaydet
        run: |
          cd site/data/enerji
          [ -f kurulu_guc.json ] || exit 0
          git init -q -b enerji
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add -A
          git commit -qm "enerji $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" enerji
          rm -rf .git
