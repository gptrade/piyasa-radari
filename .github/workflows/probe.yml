name: probe-saglik
# Geçici sağlık kontrolü (arastirma-saglik dalı). İş bitince dal silinir.
on:
  push:
    branches: [arastirma-saglik]
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: CBO arama 3
        run: |
          mkdir -p probe
          pip install -q -r requirements.txt
          python - > probe/log13.txt 2>&1 <<'PY' || true
          import json
          from radar.regwatch import Fetcher
          f = Fetcher()
          base = "https://cbo.gov.om/_api/search/query"
          tries = [
            {"querytext": "'(IsDocument:\"True\" OR contentclass:\"STS_ListItem\") (CBOItemVisibility:b2c OR CBOItemVisibility:All)'", "sourceid": "'a52a80b8-1b71-4ecd-b3a5-681645e00edf'", "selectproperties": "'Title,Path,CBOItemDate,CircularFilename,CBOAttachment'", "sortlist": "'CBOItemDate:descending'", "rowlimit": "10", "QueryPropertiesTemplateUrl": "'querygroup://webroot/Pages/Circulars.aspx?groupname=Default'"},
            {"querytext": "'*'", "sourceid": "'a52a80b8-1b71-4ecd-b3a5-681645e00edf'", "rowlimit": "10"},
            {"querytext": "'path:\"https://cbo.gov.om/sites/assets/Documents/English/Circulars\"'", "rowlimit": "10", "selectproperties": "'Title,Path,LastModifiedTime'"},
            {"querytext": "'Circular'", "rowlimit": "10", "selectproperties": "'Title,Path,LastModifiedTime,CBOItemDate'"},
          ]
          for p in tries:
              try:
                  r = f.s.get(base, params=p, headers={"Accept": "application/json;odata=verbose"}, timeout=45, verify=f._verify(base))
              except Exception as e:
                  print("hata", repr(e)[:200]); continue
              print(p["querytext"], r.status_code, len(r.text), r.text[:200] if r.status_code != 200 else "")
              if r.status_code == 200:
                  rows = r.json()["d"]["query"]["PrimaryQueryResult"]["RelevantResults"]["Table"]["Rows"]["results"]
                  for row in rows[:8]:
                      c = {x["Key"]: x["Value"] for x in row["Cells"]["results"]}
                      print("  ", {k: (c.get(k) or "")[:80] for k in ("Title", "CBOItemDate", "LastModifiedTime", "Path")})
          PY

      - name: kaydet
        if: always()
        run: |
          git config user.name "Gursah"; git config user.email "gptrade@users.noreply.github.com"
          git add -A probe; git commit -qm "probe sonuçları" || true; git push -q
