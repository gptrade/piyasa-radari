name: probe-bist  # p62c
on:
  push:
    branches: [arastirma-bist-veri]
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/checkout@v4
        with: { ref: onizleme-sozlesme, path: app, fetch-depth: 0 }
      - name: KAP sözleşme denemesi
        run: |
          mkdir -p probe62; pip install -q -r app/requirements.txt
          git -C app fetch -q origin fin
          python probe62.py > probe62/sonuc.txt 2>&1 || true
      - name: kaydet
        if: always()
        run: |
          git config user.name "Gursah"; git config user.email "gptrade@users.noreply.github.com"
          git add -A probe62; git commit -qm "probe62 sonuçları" || true; git push -q
