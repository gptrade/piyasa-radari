name: probe-saglik
# Geçici sağlık kontrolü (arastirma-saglik dalı). İş bitince dal silinir.
on:
  push:
    branches: [arastirma-saglik]
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Access giris sayfasi
        run: |
          mkdir -p probe
          L=$(curl -s -o /dev/null -w "%{redirect_url}" https://radar.lyracube.com/)
          curl -s -L "$L" -o /tmp/login.html
          python3 - > probe/log42.txt <<'PY'
          import re, base64, json, urllib.parse
          h = open("/tmp/login.html", encoding="utf-8", errors="ignore").read()
          print("uzunluk", len(h), "pages.dev geçiyor:", h.count("pages.dev"), "radar.lyracube.com geçiyor:", h.count("radar.lyracube.com"))
          for m in set(re.findall(r"https?://[a-z0-9.-]+(?:pages\.dev|lyracube\.com)[^\"'\s<]{0,60}", h)):
              print("adres:", re.sub(r"(nonce|state|kid|meta|token)=[^&]*", r"\1=…", m))
          PY

      - name: kaydet
        if: always()
        run: |
          git config user.name "Gursah"; git config user.email "gptrade@users.noreply.github.com"
          git add -A probe; git commit -qm "probe sonuçları" || true; git push -q
