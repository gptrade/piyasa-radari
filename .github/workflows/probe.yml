name: probe-bist  # p12
on:
  push:
    branches: [arastirma-bist-veri]
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: rapor kaynakları sondajı
        run: |
          set +e
          mkdir -p probe12
          pip install -q requests feedparser pypdf
          python probe12.py > probe12/sonuc.txt 2>&1
      - name: kaydet
        run: |
          git config user.name "Gursah"; git config user.email "gptrade@users.noreply.github.com"
          git add -A probe12; git commit -qm "probe12 sonuçları" || true; git push -q
