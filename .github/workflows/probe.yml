name: probe-saglik
# Geçici sağlık kontrolü (arastirma-saglik dalı). İş bitince dal silinir.
on:
  push:
    branches: [arastirma-saglik]
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: SPK ve BIST duyuru kaynaklarını yokla
        env:
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
        run: |
          mkdir -p probe
          pip install -q -r requirements.txt
          python - > probe/log3.txt 2>&1 <<'PY' || true
          import os, json, requests
          key = os.environ.get("EVDS_API_KEY")
          print("key", bool(key))
          base = "https://evds3.tcmb.gov.tr/igmevdsms-dis/"
          for path in ["datagroups/mode=2&code=bie_pkauo&type=json", "serieList/type=json&code=bie_pkauo",
                       "datagroups/mode=0&type=json", "categories/type=json"]:
              try:
                  r = requests.get(base + path, headers={"key": key}, timeout=40)
                  t = r.text
                  print("==", path, r.status_code, len(t))
                  if "categories" in path or "mode=0" in path:
                      try:
                          js = r.json()
                          for x in js:
                              s = json.dumps(x, ensure_ascii=False)
                              if any(w in s.lower() for w in ("beklenti", "katılımcı", "katilimci", "expectation")):
                                  print("  ", s[:300])
                      except Exception as e: print("json?", e, t[:300])
                  else:
                      print(t[:3000])
              except Exception as e:
                  print("hata", path, e)
          PY
      - name: kaydet
        if: always()
        run: |
          git config user.name "Gursah"; git config user.email "gptrade@users.noreply.github.com"
          git add -A probe; git commit -qm "probe sonuçları" || true; git push -q
