name: probe-saglik
# Geçici sağlık kontrolü (arastirma-saglik dalı). İş bitince dal silinir.
on:
  push:
    branches: [arastirma-saglik]
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Brent / MOVE ilişkisi ve EVDS tahvil serileri
        env:
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
        run: |
          git fetch -q --depth 1 origin main guc fin
          mkdir -p main guc fin
          git archive origin/main | tar -x -C main
          git archive origin/guc px.parquet kredili.json | tar -x -C guc
          git archive origin/fin _universe.json | tar -x -C fin
          pip install -q -r main/requirements.txt
          python probe/scripts/brent_evds.py || true
          rm -rf main guc fin

      - name: kaydet
        if: always()
        run: |
          git config user.name "Gursah"; git config user.email "gptrade@users.noreply.github.com"
          git add -A probe; git commit -qm "probe sonuçları" || true; git push -q
