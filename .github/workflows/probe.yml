name: probe-saglik
# Geçici sağlık kontrolü (arastirma-saglik dalı). İş bitince dal silinir.
on:
  push:
    branches: [arastirma-saglik]
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: SPK ve BIST duyuru kaynaklarını yokla
        env:
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
        run: |
          mkdir -p probe
          pip install -q -r requirements.txt
          python - > probe/log5.txt 2>&1 <<'PY' || true
          import os, requests, json
          key = os.environ.get("EVDS_API_KEY")
          base = "https://evds3.tcmb.gov.tr/igmevdsms-dis/"
          for codes, extra in [("TP.APIFON4", ""), ("TP.PKAUO.S04.D.U-TP.PKAUO.S01.E.U", "&frequency=5")]:
              r = requests.get(base + f"series={codes}&startDate=01-10-2022&endDate=20-10-2026&type=json{extra}", headers={"key": key}, timeout=60)
              js = r.json(); items = js.get("items") or []
              print("==", codes, r.status_code, len(items))
              json.dump(items, open(f"probe/evds_{codes.split('-')[0]}.json", "w"))
              print(items[:2], items[-2:])
          PY
      - name: kaydet
        if: always()
        run: |
          git config user.name "Gursah"; git config user.email "gptrade@users.noreply.github.com"
          git add -A probe; git commit -qm "probe sonuçları" || true; git push -q
