name: probe-bist  # p65
on:
  push:
    branches: [arastirma-bist-veri]
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/checkout@v4
        with: { ref: main, path: app, fetch-depth: 0 }
      - name: Faktör geri testi verisi
        run: |
          mkdir -p probe65; pip install -q -r app/requirements.txt
          git -C app fetch -q origin fin
          python probe65.py > probe65/sonuc.txt 2>&1 || true
      - name: kaydet
        if: always()
        run: |
          git config user.name "Gursah"; git config user.email "gptrade@users.noreply.github.com"
          git add -A probe65; git commit -qm "probe65 sonuçları" || true; git push -q
