name: probe-bist  # p39
on:
  push:
    branches: [arastirma-bist-veri]
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/checkout@v4
        with: { ref: main, path: app }
      - name: Takvim kaynakları
        run: |
          set +e
          pip install -q requests lxml
          python probe39.py > probe39_sonuc.txt 2>&1 || true
          mv probe39_sonuc.txt probe39/sonuc.txt
      - name: kaydet
        if: always()
        run: |
          git config user.name "Gursah"; git config user.email "gptrade@users.noreply.github.com"
          git add -A probe39; git commit -qm "probe39 sonuçları" || true; git push -q
