name: probe-saglik
# Geçici sağlık kontrolü (arastirma-saglik dalı). İş bitince dal silinir.
on:
  push:
    branches: [arastirma-saglik]
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: ABD isi haritasi
        run: |
          mkdir -p probe
          git clone -q -b onizleme-bugun2 --depth 1 https://github.com/gptrade/piyasa-radari.git /tmp/pr
          cd /tmp/pr && pip install -q -r requirements.txt && mkdir -p site/data
          ( time python -m radar.usmap --force ) > $GITHUB_WORKSPACE/probe/log33.txt 2>&1 || true
          cp site/data/us_map.json site/data/us_shares.json $GITHUB_WORKSPACE/probe/ || true

      - name: kaydet
        if: always()
        run: |
          git config user.name "Gursah"; git config user.email "gptrade@users.noreply.github.com"
          git add -A probe; git commit -qm "probe sonuçları" || true; git push -q
