name: probe-bist  # p11b
on:
  push:
    branches: [arastirma-bist-veri]
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/checkout@v4
        with: { ref: onizleme-kuresel, path: app }
      - name: küresel makro kuru çalıştırma
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.PIYASA_RADARI }}
        run: |
          set +e
          mkdir -p probe11
          pip install -q -r app/requirements.txt
          python probe11.py > probe11/sonuc.txt 2>&1
      - name: kaydet
        run: |
          git config user.name "Gursah"; git config user.email "gptrade@users.noreply.github.com"
          git add -A probe11; git commit -qm "probe11 sonuçları" || true; git push -q
