name: probe-saglik
# Geçici sağlık kontrolü (arastirma-saglik dalı). İş bitince dal silinir.
on:
  push:
    branches: [arastirma-saglik]
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Regülasyon yeni kanallar
        run: |
          mkdir -p probe
          git fetch -q --depth 1 origin onizleme-regulasyon-kanal && git checkout FETCH_HEAD -- radar config
          pip install -q -r requirements.txt
          python - > probe/log17.txt 2>&1 <<'PY' || true
          import re, json, collections
          from radar import regwatch as R
          cfg = R.load_config()
          cfg["regulators"] = [r for r in cfg["regulators"] if r["id"] in ("cbb", "cbo", "boi", "bdl", "cbar", "cbuae")]
          items, status = R.collect(cfg)
          print(json.dumps(status, ensure_ascii=False))
          by = collections.defaultdict(list)
          for it in items: by[it["reg"]].append(it)
          for k, v in by.items():
              v.sort(key=lambda x: x["date"] or "", reverse=True)
              print("==", k, len(v)); [print("   ", it["date"], it.get("via", ""), it["title"][:110]) for it in v[:12]]
          f = R.Fetcher()
          for u in ["https://qanoon.om/?s=%D8%A7%D9%84%D8%A8%D9%86%D9%83+%D8%A7%D9%84%D9%85%D8%B1%D9%83%D8%B2%D9%8A&feed=rss2"]:
              r = f.s.get(u, timeout=40); its = re.findall(r"<item>.*?<title>(.*?)</title>.*?<pubDate>(.*?)</pubDate>", r.text, re.S)
              print("QANOON", r.status_code, len(its), [(t[:80], d[5:16]) for t, d in its[:8]])
          for u in ["https://api.e-qanun.az/", "https://napi.e-qanun.az/", "https://api.e-qanun.az/getDetailSearch?start=0&length=10&orderColumn=8&orderDirection=desc&title=true&searchWord=M%C9%99rk%C9%99zi+Bank", "https://api.e-qanun.az/getDetailSearch?start=0&length=10&orderColumn=8&orderDirection=desc&codeType=1&dateType=1"]:
              try:
                  r = f.s.get(u, timeout=30); print("EQANUN", u[:110], r.status_code, r.text[:300].replace("\n", " "))
              except Exception as e: print("EQANUN", u, "HATA", type(e).__name__)
          PY

      - name: kaydet
        if: always()
        run: |
          git config user.name "Gursah"; git config user.email "gptrade@users.noreply.github.com"
          git add -A probe; git commit -qm "probe sonuçları" || true; git push -q
