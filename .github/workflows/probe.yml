name: probe-saglik
# Geçici sağlık kontrolü (arastirma-saglik dalı). İş bitince dal silinir.
on:
  push:
    branches: [arastirma-saglik]
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: SEC örnekleri
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          mkdir -p probe/sec
          python3 - > probe/log43.txt <<'PY'
          import json, os, time, urllib.request, gzip
          ua = os.environ.get("SEC_USER_AGENT") or "piyasa-radari research bot"
          ciks = {"XOM": 34088, "AZO": 866787, "DTE": 936340, "V": 1403161, "UPS": 1090727, "GOOGL": 1652044}
          for code, cik in ciks.items():
              req = urllib.request.Request(f"https://data.sec.gov/api/xbrl/companyfacts/CIK{cik:010d}.json", headers={"User-Agent": ua, "Accept-Encoding": "gzip"})
              raw = urllib.request.urlopen(req, timeout=60).read()
              try: raw = gzip.decompress(raw)
              except OSError: pass
              d = json.loads(raw)
              keep = {"entityName": d.get("entityName"), "facts": {}}
              for tax, tags in d["facts"].items():
                  for t, v in tags.items():
                      if tax == "dei" or any(k in t for k in ("Revenue", "Sales", "NetIncome", "ProfitLoss", "Assets", "Shares", "Equity", "Dividend", "OperatingIncome", "CostOf", "GrossProfit", "Depreciation", "NetCashProvided", "PaymentsToAcquire", "Liabilities", "Debt", "Cash", "Interest", "IncomeTax")):
                          if not t.startswith(("Deferred", "Defined")):
                              keep["facts"].setdefault(tax, {})[t] = {"units": {u: [{k: f.get(k) for k in ("start", "end", "val", "filed", "form", "fp", "fy", "accn", "frame")} for f in fs if (f.get("end") or "") >= "2021-01-01"] for u, fs in v["units"].items()}}
              json.dump(keep, gzip.open(f"probe/sec/{code}.json.gz", "wt"), separators=(",", ":"))
              print(code, len(raw), len(keep["facts"].get("us-gaap", {})))
              time.sleep(0.3)
          PY

      - name: kaydet
        if: always()
        run: |
          git config user.name "Gursah"; git config user.email "gptrade@users.noreply.github.com"
          git add -A probe; git commit -qm "probe sonuçları" || true; git push -q
