name: probe-bist  # p36
on:
  push:
    branches: [arastirma-bist-veri]
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/checkout@v4
        with: { ref: onizleme-banka, path: app }
      - name: KAP mali tablo fizibilitesi
        env:
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
          FIN_CODES: AKBNK,GARAN,YKBNK,ISCTR,ANSGR,TURSG,ANHYT
        run: |
          set +e
          mkdir -p probe36
          pip install -q -r app/requirements.txt
          python probe36.py > probe36/sonuc.txt 2>&1 || true
      - name: kaydet
        if: always()
        run: |
          git config user.name "Gursah"; git config user.email "gptrade@users.noreply.github.com"
          git add -A probe36; git commit -qm "probe36 sonuçları" || true; git push -q
