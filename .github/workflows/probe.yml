name: probe-bist  # p58
on:
  push:
    branches: [arastirma-bist-veri]
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/checkout@v4
        with: { ref: onizleme-kazanc-takvimi, path: app }
      - name: Takvim kaynakları
        env:
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
        run: |
          set +e
          pip install -q -r app/requirements.txt
          mkdir -p probe58
          pip install -q requests pandas lxml yfinance
          python probe58.py > probe58/sonuc.txt 2>&1 || true
      - name: kaydet
        if: always()
        run: |
          git config user.name "Gursah"; git config user.email "gptrade@users.noreply.github.com"
          git add -A probe58; git commit -qm "probe58 sonuçları" || true; git push -q
