name: probe-bist
on:
  push:
    branches: [arastirma-bist-veri]
    paths: [".github/workflows/probe.yml", "probe_urls.txt"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: indir
        run: |
          set +e
          rm -rf probe3 && mkdir -p probe4 && cd probe4
          curl -sS -m 30 -o inter.der http://secure.globalsign.com/cacert/gsrsaovsslca2018.crt
          openssl x509 -inform der -in inter.der -out inter.pem && echo "inter ok" > status.txt
          cat /etc/ssl/certs/ca-certificates.crt inter.pem > bundle.pem
          for u in "https://www.bddk.org.tr/Duyuru/Liste/39" "https://www.bddk.org.tr/Duyuru/Liste/40" "https://www.bddk.org.tr/BultenAylik"; do
            n=$(echo "$u" | sed 's#[^a-zA-Z0-9]#_#g' | cut -c1-60)
            curl -sSL -m 40 --cacert bundle.pem -A "Mozilla/5.0" -o "$n.html" -w "$u %{http_code} %{size_download}\n" "$u" >> status.txt 2>>err.txt
          done
          rm -f inter.der bundle.pem
      - name: kaydet
        run: |
          git config user.name "Gursah"; git config user.email "gptrade@users.noreply.github.com"
          git add -A probe4 probe3; git commit -qm "probe3 sonuçları" || true; git push -q
