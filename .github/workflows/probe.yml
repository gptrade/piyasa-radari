name: probe-bist
on:
  push:
    branches: [arastirma-bist-veri]
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/checkout@v4
        with: { ref: onizleme-marketaux, path: app }
      - name: marketaux kuru çalıştırma
        env:
          MARKETAUX_API_TOKEN: ${{ secrets.MARKETAUX_API_TOKEN }}
        run: |
          set +e
          mkdir -p probe7
          cd app && pip install -q -r requirements.txt
          python - <<'PY' > ../probe7/sonuc.txt 2>&1
          from datetime import timedelta
          from radar.config import load_settings, load_watchlist, TickerMatcher
          from radar.models import now_utc
          from radar.sources import Context, marketaux
          from radar import http
          st = load_watchlist()
          ctx = Context(settings=load_settings(), stocks=st, matcher=TickerMatcher(st), since=now_utc() - timedelta(hours=6))
          items = marketaux.collect(ctx)
          print("kayıt:", len(items), "uyarı:", http.FAILURES)
          for i in items:
              print(" ", i.published[:16], i.market, i.tickers, i.extra.get("mx"), "|", i.source, "|", i.title[:90])
          PY
      - name: kaydet
        run: |
          git config user.name "Gursah"; git config user.email "gptrade@users.noreply.github.com"
          git add -A probe6; git commit -qm "probe6 sonuçları" || true; git push -q
