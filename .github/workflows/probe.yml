name: probe-saglik
# Geçici sağlık kontrolü (arastirma-saglik dalı). İş bitince dal silinir.
on:
  push:
    branches: [arastirma-saglik]
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: SPK ve BIST duyuru kaynaklarını yokla
        run: |
          mkdir -p probe
          pip install -q -r requirements.txt
          python - > probe/log.txt 2>&1 <<'PY' || true
          import re
          from radar import http
          from radar.sources import spk, tr_official
          u = spk.LIST_URL.format(year=2026)
          r = http.get(u)
          print("SPK", u, None if r is None else (r.status_code, len(r.text), r.url))
          if r is not None:
              bs = spk.parse_listing(r.text, u)
              print("parse", len(bs), [(b["no"], str(b["date"])) for b in bs[:6]])
              print("pdf links", re.findall(r'href="([^"]+\.pdf)"', r.text, re.I)[:10])
              i = r.text.find("2026/7")
              print("snippet", re.sub(r"\s+", " ", r.text[max(0, i-800):i+1200]))
          r = http.get(tr_official.BIST_ANN_URL)
          print("BIST", tr_official.BIST_ANN_URL, None if r is None else (r.status_code, len(r.text)))
          if r is not None:
              rows = tr_official.parse_bist_announcements(r.text)
              print("rows", len(rows), [(str(x["date"])[:10], x["title"][:50]) for x in rows[:5]])
          PY
      - name: kaydet
        if: always()
        run: |
          git config user.name "Gursah"; git config user.email "gptrade@users.noreply.github.com"
          git add -A probe; git commit -qm "probe sonuçları" || true; git push -q
