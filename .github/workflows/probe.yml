name: probe-saglik
# Geçici sağlık kontrolü (arastirma-saglik dalı). İş bitince dal silinir.
on:
  push:
    branches: [arastirma-saglik]
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: CBO sayfa
        run: |
          mkdir -p probe
          pip install -q -r requirements.txt
          python - > probe/log10.txt 2>&1 <<'PY' || true
          from radar.regwatch import Fetcher, from_html
          f = Fetcher()
          for i, u in enumerate(["https://cbo.gov.om/Pages/Circulars.aspx", "https://cbo.gov.om/"]):
              r = f.get(u)
              if r is None: print(u, "yok"); continue
              open(f"probe/cbo{i}.html", "w", encoding="utf-8").write(r.text)
              got = from_html(r.text, u)
              print(u, r.status_code, len(r.text), "bağlantı", len(got), "tarihli", sum(1 for g in got if g["date"]))
              print([ (g["title"][:50], g["date"]) for g in got[:8]])
          PY

      - name: kaydet
        if: always()
        run: |
          git config user.name "Gursah"; git config user.email "gptrade@users.noreply.github.com"
          git add -A probe; git commit -qm "probe sonuçları" || true; git push -q
