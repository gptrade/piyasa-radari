name: probe-bist  # p26
on:
  push:
    branches: [arastirma-bist-veri]
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/checkout@v4
        with: { ref: onizleme-temel-analiz, path: app }
      - name: KAP mali tablo fizibilitesi
        env:
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
        run: |
          set +e
          mkdir -p probe26
          pip install -q -r app/requirements.txt
          python probe26.py > probe26/sonuc.txt 2>&1 || true
      - name: kaydet
        if: always()
        run: |
          git config user.name "Gursah"; git config user.email "gptrade@users.noreply.github.com"
          git add -A probe26; git commit -qm "probe26 sonuçları" || true; git push -q
