name: probe-saglik
# Geçici sağlık kontrolü (arastirma-saglik dalı). İş bitince dal silinir.
on:
  push:
    branches: [arastirma-saglik]
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: EVDS beklenti ve TÜFE serileri
        env:
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
        run: |
          mkdir -p probe
          pip install -q requests
          python - > probe/log26.txt 2>&1 <<'PY' || true
          import os, requests, json
          key = os.environ.get("EVDS_API_KEY"); H = {"key": key}
          base = "https://evds3.tcmb.gov.tr/igmevdsms-dis/"
          r = requests.get(base + "serieList/type=json&code=bie_pkauo", headers=H, timeout=60)
          for x in r.json(): print("PKA", x["SERIE_CODE"], "|", x["SERIE_NAME"], "|", x["START_DATE"], x["END_DATE"])
          for kw in ["TP.TUKFIY2025.GENEL", "TP.FG.J0", "TP.APIFON4"]:
              pass
          for codes in ["TP.PKAUO.S01.A.U-TP.PKAUO.S01.B.U", "TP.TUKFIY2025.GENEL", "TP.FG.J0"]:
              r = requests.get(base + f"series={codes}&startDate=01-01-2013&endDate=03-11-2026&type=json&frequency=5", headers=H, timeout=60)
              items = r.json().get("items") or []
              print("==", codes, r.status_code, len(items), items[:2], items[-3:])
          # politika faizi grupları
          for g in ["bie_pyrepo", "bie_mbpfaiz", "bie_tcmbfaiz"]:
              try:
                  r = requests.get(base + f"serieList/type=json&code={g}", headers=H, timeout=40)
                  for x in r.json()[:20]: print("G", g, x["SERIE_CODE"], "|", x["SERIE_NAME"], "|", x["START_DATE"], x["END_DATE"])
              except Exception as e: print("G", g, "yok", str(e)[:80])
          r = requests.get(base + "datagroups/mode=2&code=bie_pyrepo&type=json", headers=H, timeout=40); print("DG", r.status_code, r.text[:300])
          r = requests.get(base + "datagroups/mode=1&code=2&type=json", headers=H, timeout=40)
          try:
              for x in r.json(): print("DG1", x.get("DATAGROUP_CODE"), "|", x.get("DATAGROUP_NAME"))
          except Exception as e: print("DG1 hata", r.status_code, r.text[:200])
          PY

      - name: kaydet
        if: always()
        run: |
          git config user.name "Gursah"; git config user.email "gptrade@users.noreply.github.com"
          git add -A probe; git commit -qm "probe sonuçları" || true; git push -q
