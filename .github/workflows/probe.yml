name: probe-saglik
# Geçici sağlık kontrolü (arastirma-saglik dalı). İş bitince dal silinir.
on:
  push:
    branches: [arastirma-saglik]
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: CBO arama
        run: |
          mkdir -p probe
          pip install -q -r requirements.txt
          python - > probe/log11.txt 2>&1 <<'PY' || true
          import json
          from radar.regwatch import Fetcher
          f = Fetcher()
          r = f.get("https://cbo.gov.om/robots.txt"); print("robots", None if r is None else r.text[:600])
          q = "(IsDocument:\"True\" OR contentclass:\"STS_ListItem\") (CBOItemVisibility:b2c OR CBOItemVisibility:All)"
          url = ("https://cbo.gov.om/_api/search/query?querytext='" + q + "'&sourceid='a52a80b8-1b71-4ecd-b3a5-681645e00edf'"
                 "&selectproperties='Title,Path,CBOItemDate,CircularFilename,CBOAttachment,CBOItemSummary'&sortlist='CBOItemDate:descending'&rowlimit=15")
          r = f.get(url, headers={"Accept": "application/json;odata=verbose"})
          print("arama", None if r is None else (r.status_code, len(r.text)))
          if r is not None:
              js = r.json()
              rows = js["d"]["query"]["PrimaryQueryResult"]["RelevantResults"]["Table"]["Rows"]["results"]
              print("satır", len(rows))
              for row in rows[:10]:
                  c = {x["Key"]: x["Value"] for x in row["Cells"]["results"]}
                  print({k: (c.get(k) or "")[:90] for k in ("Title", "CBOItemDate", "Path", "CircularFilename", "CBOAttachment")})
          PY

      - name: kaydet
        if: always()
        run: |
          git config user.name "Gursah"; git config user.email "gptrade@users.noreply.github.com"
          git add -A probe; git commit -qm "probe sonuçları" || true; git push -q
