name: probe-saglik
# Geçici sağlık kontrolü (arastirma-saglik dalı). İş bitince dal silinir.
on:
  push:
    branches: [arastirma-saglik]
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: VAP fiili dolasim 2
        run: |
          mkdir -p probe
          pip install -q requests lxml pypdf
          python - > probe/log22.txt 2>&1 <<'PY' || true
          import re, io, requests
          UA = {"User-Agent": "Mozilla/5.0 (compatible; LyraRadar/1.0; kisisel kullanim)"}
          g = lambda u, **k: requests.get(u, headers=UA, timeout=40, **k)
          r = g("https://www.vap.org.tr/robots.txt"); print([l for l in r.text.splitlines() if l.startswith(("Disallow", "Crawl"))])
          r = g("https://mobil.vap.org.tr/robots.txt"); print("mobil robots", r.status_code, r.text[:600])
          from pypdf import PdfReader
          r = g("https://www.vap.org.tr/sites/default/files/2026-09/telif-hakki-ve-cekince-ihbari.pdf")
          print("TELIF", r.status_code); print("\n".join(p.extract_text() for p in PdfReader(io.BytesIO(r.content)).pages)[:5000])
          r = g("https://mobil.vap.org.tr/workspace/Fiilipay.html"); print("== Fiilipay", r.status_code, len(r.text)); t = r.text
          print(t[:3000])
          for m in sorted(set(re.findall(r'(?:src|href)="([^"]+)"', t))): print("link", m)
          for m in sorted(set(re.findall(r'["\'](https?://[^"\']+|/[A-Za-z0-9_/.-]*(?:api|json|data|xls|csv|service)[^"\']*)["\']', t)))[:80]: print("url", m)
          for js in sorted(set(re.findall(r'src="([^"]+\.js[^"]*)"', t)))[:8]:
              u = js if js.startswith("http") else "https://mobil.vap.org.tr/workspace/" + js.lstrip("./")
              try:
                  jt = g(u).text
                  print("JS", u, len(jt))
                  for m in sorted(set(re.findall(r'["\'`]((?:https?://|/)[^"\'`\s]*(?:api|Api|json|data|Data|xls|csv|service|Service)[^"\'`\s]*)["\'`]', jt)))[:40]: print("  url", m)
              except Exception as e: print("JS hata", u, e)
          PY

      - name: kaydet
        if: always()
        run: |
          git config user.name "Gursah"; git config user.email "gptrade@users.noreply.github.com"
          git add -A probe; git commit -qm "probe sonuçları" || true; git push -q
