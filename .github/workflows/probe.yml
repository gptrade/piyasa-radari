name: probe-saglik
# Geçici sağlık kontrolü (arastirma-saglik dalı). İş bitince dal silinir.
on:
  push:
    branches: [arastirma-saglik]
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: SPK ve BIST duyuru kaynaklarını yokla
        run: |
          mkdir -p probe
          pip install -q -r requirements.txt
          python - > probe/log2.txt 2>&1 <<'PY' || true
          import re
          from radar.regwatch import Fetcher, load_config
          f = Fetcher()
          cfg = load_config()
          for reg in cfg["regulators"]:
              for src in reg.get("sources") or []:
                  r = f.get(src["url"])
                  if r is None:
                      print("==", reg["id"], "YOK"); continue
                  t = re.sub(r"<script[\s\S]*?</script>|<style[\s\S]*?</style>", " ", r.text)
                  hits = [m.start() for m in re.finditer(r"(?i)effective|yürürlük|yururluk|issue date|issued on|تاريخ", t)][:4]
                  print("==", reg["id"], src["url"][:80], len(t), "isabet", len(hits))
                  for h in hits:
                      print("   ", re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " | ", t[max(0, h - 300):h + 400]))[:600])
          PY
      - name: kaydet
        if: always()
        run: |
          git config user.name "Gursah"; git config user.email "gptrade@users.noreply.github.com"
          git add -A probe; git commit -qm "probe sonuçları" || true; git push -q
