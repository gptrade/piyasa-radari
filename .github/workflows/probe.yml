name: probe-bist  # p18
on:
  push:
    branches: [arastirma-bist-veri]
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: KAP mali tablo fizibilitesi
        run: |
          set +e
          mkdir -p probe18
          pip install -q requests
          python probe18.py > probe18/sonuc.txt 2>&1 || true
      - name: kaydet
        if: always()
        run: |
          git config user.name "Gursah"; git config user.email "gptrade@users.noreply.github.com"
          git add -A probe18; git commit -qm "probe18 sonuçları" || true; git push -q
