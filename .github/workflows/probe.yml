name: probe-saglik
# Geçici sağlık kontrolü (arastirma-saglik dalı). İş bitince dal silinir.
on:
  push:
    branches: [arastirma-saglik]
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: KAP endeks sayfası
        run: |
          mkdir -p probe
          pip install -q -r requirements.txt
          python - > probe/log19.txt 2>&1 <<'PY' || true
          import re
          from radar import http
          from radar.fundamentals import kapfin
          r = http.get(kapfin.INDEX_URL, timeout=60); t = r.text.replace('\\"', '"')
          for c in ["HALKB", "QNBTR", "KLNMA", "GARAN"]:
              for m in list(re.finditer(c, t))[:2]:
                  print(c, "|", t[max(0, m.start() - 60): m.end() + 120].replace("\n", " "))
          idx = kapfin.parse_indices(r.text); print("XUTUM", len(idx.get("XUTUM", [])), "XU100", len(idx.get("XU100", [])))
          multi = re.findall(r'"stockCode":"([A-Z0-9]+, [A-Z0-9, ]+)"', t); print("çok kodlu", len(set(multi)), sorted(set(multi))[:40])
          PY

      - name: kaydet
        if: always()
        run: |
          git config user.name "Gursah"; git config user.email "gptrade@users.noreply.github.com"
          git add -A probe; git commit -qm "probe sonuçları" || true; git push -q
