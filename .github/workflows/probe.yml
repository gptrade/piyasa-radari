name: probe-bist  # p63b
on:
  push:
    branches: [arastirma-bist-veri]
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/checkout@v4
        with: { ref: onizleme-gyo-pddd, path: app, fetch-depth: 0 }
      - name: GYO PD/DD
        run: |
          mkdir -p probe63; pip install -q -r app/requirements.txt
          git -C app fetch -q origin fin
          python probe63.py > probe63/sonuc.txt 2>&1 || true
      - name: kaydet
        if: always()
        run: |
          git config user.name "Gursah"; git config user.email "gptrade@users.noreply.github.com"
          git add -A probe63; git commit -qm "probe63 sonuçları" || true; git push -q
