name: probe-bist  # p10
on:
  push:
    branches: [arastirma-bist-veri]
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: küresel kaynak sondajı
        run: |
          set +e
          mkdir -p probe10
          pip install -q requests feedparser
          python probe10.py > probe10/sonuc.txt 2>&1
      - name: kaydet
        run: |
          git config user.name "Gursah"; git config user.email "gptrade@users.noreply.github.com"
          git add -A probe10; git commit -qm "probe10 sonuçları" || true; git push -q
