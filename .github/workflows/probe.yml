name: probe-saglik
# Geçici sağlık kontrolü (arastirma-saglik dalı). İş bitince dal silinir.
on:
  push:
    branches: [arastirma-saglik]
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Fiili dolaşım kaynakları
        run: |
          mkdir -p probe
          pip install -q requests lxml
          python - > probe/log21.txt 2>&1 <<'PY' || true
          import re, requests
          UA = {"User-Agent": "Mozilla/5.0 (compatible; LyraRadar/1.0; kisisel kullanim)"}
          def show(u, n=1500, **kw):
              try:
                  r = requests.get(u, headers=UA, timeout=40, **kw)
                  print("==", u, r.status_code, r.headers.get("content-type"), len(r.content))
                  return r
              except Exception as e:
                  print("==", u, "HATA", e); return None
          for u in ["https://www.vap.org.tr/robots.txt", "https://www.kap.org.tr/robots.txt", "https://www.mkk.com.tr/robots.txt"]:
              r = show(u)
              if r is not None: print(r.text[:800])
          r = show("https://www.vap.org.tr/fiili-dolasim-raporu")
          if r is not None:
              t = r.text
              print(t[:1500])
              for m in sorted(set(re.findall(r'(?:href|src)="([^"]+)"', t)))[:80]: print("link", m)
              for m in sorted(set(re.findall(r'["\'](/?(?:api|apix|Api|assets|_next)[^"\']{0,120})["\']', t)))[:60]: print("api", m)
          r = show("https://www.vap.org.tr/")
          if r is not None:
              for m in sorted(set(re.findall(r'(?:href|src)="([^"]+\.js)"', r.text)))[:20]: print("js", m)
          r = show("https://www.kap.org.tr/tr/sirket-bilgileri/ozet/2428-turkiye-vakiflar-bankasi-t-a-o")
          if r is not None:
              t = r.text.replace('\\"', '"')
              for k in ["Fiili Dolaşım", "fiili dolaşım", "freeFloat", "FiiliDolasim", "Dolaşımdaki"]:
                  for m in list(re.finditer(k, t))[:3]: print(k, "|", t[max(0, m.start()-200): m.end()+300].replace("\n", " "))
          PY

      - name: kaydet
        if: always()
        run: |
          git config user.name "Gursah"; git config user.email "gptrade@users.noreply.github.com"
          git add -A probe; git commit -qm "probe sonuçları" || true; git push -q
