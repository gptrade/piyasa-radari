name: probe-saglik
# Geçici sağlık kontrolü (arastirma-saglik dalı). İş bitince dal silinir.
on:
  push:
    branches: [arastirma-saglik]
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: TSPB kredili işlemler
        run: |
          mkdir -p probe/tspb
          {
            echo "== robots"; curl -sS -A "Mozilla/5.0 (compatible; LyraRadar/1.0)" https://tspb.org.tr/robots.txt | head -40
            echo "== veriler linkleri"; curl -sS -A "Mozilla/5.0 (compatible; LyraRadar/1.0)" https://tspb.org.tr/veriler/ | grep -oE 'https://tspb.org.tr/wp-content/uploads/[^"]+\.xlsx' | sort -u
          } > probe/log44.txt 2>&1
          curl -sS -A "Mozilla/5.0 (compatible; LyraRadar/1.0)" -o probe/tspb/aylik.xlsx https://tspb.org.tr/wp-content/uploads/2026/11/BTVY_Araci_Kurumlarin_Kredili_Islemleri_20261104_140043.xlsx || true
          curl -sS -A "Mozilla/5.0 (compatible; LyraRadar/1.0)" -o probe/tspb/arsiv.xlsx https://tspb.org.tr/wp-content/uploads/2026/02/BTVY_Krediler_2002-202512.xlsx || true
          ls -la probe/tspb >> probe/log44.txt

      - name: kaydet
        if: always()
        run: |
          git config user.name "Gursah"; git config user.email "gptrade@users.noreply.github.com"
          git add -A probe; git commit -qm "probe sonuçları" || true; git push -q
