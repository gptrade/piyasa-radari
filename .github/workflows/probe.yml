name: probe-saglik
# Geçici sağlık kontrolü (arastirma-saglik dalı). İş bitince dal silinir.
on:
  push:
    branches: [arastirma-saglik]
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: CBB rulebook sayfa
        run: |
          mkdir -p probe/alt
          pip install -q -r requirements.txt
          python - > probe/log18.txt 2>&1 <<'PY' || true
          from radar.regwatch import Fetcher, from_html
          f = Fetcher()
          for i, u in enumerate(["https://cbben.thomsonreuters.com/view-revision-updates?f_days=on&changed=-365%20day", "https://cbben.thomsonreuters.com/view-revision-updates?f_days=on&changed=-30%20day", "https://rulebook.centralbank.ae/en/view-revision-updates?f_days=on&changed=-365%20day"]):
              r = f.s.get(u, timeout=60)
              open(f"probe/alt/rb{i}.html", "w", encoding="utf-8").write(r.text)
              got = from_html(r.text, u)
              print(u, r.status_code, len(r.text), len(got), sum(1 for g in got if g["date"]), [(g["title"][:60], g["date"]) for g in got[:5]])
          PY

      - name: kaydet
        if: always()
        run: |
          git config user.name "Gursah"; git config user.email "gptrade@users.noreply.github.com"
          git add -A probe; git commit -qm "probe sonuçları" || true; git push -q
