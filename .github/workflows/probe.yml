name: probe-saglik
# Geçici sağlık kontrolü (arastirma-saglik dalı). İş bitince dal silinir.
on:
  push:
    branches: [arastirma-saglik]
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Regülasyon alternatif kanallar
        run: |
          mkdir -p probe
          pip install -q -r requirements.txt
          python - > probe/log14.txt 2>&1 <<'PY' || true
          import re
          from urllib.parse import quote_plus
          from radar.regwatch import Fetcher
          f = Fetcher(); f.gap = 0
          C = {
            "CBB rulebook": ["https://cbben.thomsonreuters.com/", "https://cbben.thomsonreuters.com/rulebook-updates", "https://cbben.thomsonreuters.com/robots.txt"],
            "CBB ana": ["https://www.cbb.gov.bh/feed/", "https://www.cbb.gov.bh/wp-json/wp/v2/posts?per_page=3", "https://www.cbb.gov.bh/robots.txt"],
            "BOI": ["https://www.boi.org.il/en/communication-and-publications/press-releases/", "https://www.boi.org.il/robots.txt", "https://www.gov.il/en/departments/bank_of_israel"],
            "BDL": ["https://www.bdl.gov.lb/circulars.php", "https://www.abl.org.lb/english/circulars", "https://www.abl.org.lb/"],
            "CBAR": ["https://www.cbar.az/", "https://cbar.az/page-41/rss", "https://e-qanun.az/", "https://www.cbar.az/rss"],
            "CBO": ["https://qanoon.om/", "https://mjla.gov.om/"],
          }
          for k, urls in C.items():
              for u in urls:
                  try:
                      r = f.s.get(u, timeout=30, verify=f._verify(u))
                      t = r.text
                      bot = "Just a moment" in t[:4000] or "captcha" in t[:4000].lower()
                      print(k, "|", u, "|", r.status_code, len(t), "BOT" if bot else "", "|", re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " ", t))[:160])
                  except Exception as e:
                      print(k, "|", u, "| HATA", type(e).__name__, str(e)[:120])
          for q in ['"Central Bank of Bahrain" circular', '"Bank of Israel" directive banks', '"Banque du Liban" circular', 'site:cbar.az', '"Central Bank of Oman" circular', '"Mərkəzi Bank" qərar']:
              u = f"https://news.google.com/rss/search?q={quote_plus(q)}+when:60d&hl=en-US&gl=US&ceid=US:en"
              r = f.s.get(u, timeout=30)
              items = re.findall(r"<item>.*?<title>(.*?)</title>.*?<pubDate>(.*?)</pubDate>", r.text, re.S)
              print("GNEWS", q, r.status_code, len(items), [ (t[:70], d[5:16]) for t, d in items[:4]])
          PY

      - name: kaydet
        if: always()
        run: |
          git config user.name "Gursah"; git config user.email "gptrade@users.noreply.github.com"
          git add -A probe; git commit -qm "probe sonuçları" || true; git push -q
