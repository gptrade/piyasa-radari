name: probe-saglik
# Geçici sağlık kontrolü (arastirma-saglik dalı). İş bitince dal silinir.
on:
  push:
    branches: [arastirma-saglik]
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Nasdaq-100 bilesenleri
        run: |
          mkdir -p probe
          pip install -q pandas lxml requests
          python - > probe/log35.txt 2>&1 <<'PY' || true
          import io, requests, pandas as pd
          h = requests.get("https://en.wikipedia.org/wiki/Nasdaq-100", headers={"User-Agent": "lyra-radar/1.0 (personal research)"}, timeout=30).text
          print(len(h))
          for i, t in enumerate(pd.read_html(io.StringIO(h))):
              cols = [str(c) for c in t.columns]
              print(i, cols, len(t))
              if len(t) > 90:
                  t.to_csv(f"probe/ndx{i}.csv", index=False)
          PY

      - name: kaydet
        if: always()
        run: |
          git config user.name "Gursah"; git config user.email "gptrade@users.noreply.github.com"
          git add -A probe; git commit -qm "probe sonuçları" || true; git push -q
