name: probe-saglik
# Geçici sağlık kontrolü (arastirma-saglik dalı). İş bitince dal silinir.
on:
  push:
    branches: [arastirma-saglik]
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Sağlık yoklaması
        env:
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
        run: |
          mkdir -p probe
          pip install -q -r requirements.txt
          python - > probe/log8.txt 2>&1 <<'PY' || true
          import os, requests, json
          from radar import http
          for u in ["https://cbo.gov.om/Pages/Circulars.aspx", "https://cbo.gov.om/"]:
              try:
                  r = requests.get(u, timeout=40, headers={"User-Agent": "Mozilla/5.0"})
                  print("CBO", u, r.status_code, len(r.text), r.text[:200].replace("\n", " "))
              except Exception as e:
                  print("CBO", u, "HATA", repr(e)[:300])
              r2 = http.get(u, timeout=40)
              print("CBO radar.http", u, None if r2 is None else (r2.status_code, len(r2.text)))
          k = os.environ.get("ALPHAVANTAGE_API_KEY")
          print("AV anahtar var:", bool(k))
          r = requests.get("https://www.alphavantage.co/query", params={"function": "NEWS_SENTIMENT", "tickers": "AAPL", "sort": "LATEST", "limit": 5, "apikey": k}, timeout=40)
          js = r.json()
          print("AV", r.status_code, list(js)[:6], {kk: str(v)[:200] for kk, v in js.items() if kk in ("Information", "Note", "Error Message", "items")})
          print("AV ilk", [(f.get("time_published"), f.get("title", "")[:60]) for f in (js.get("feed") or [])[:3]])
          PY

      - name: kaydet
        if: always()
        run: |
          git config user.name "Gursah"; git config user.email "gptrade@users.noreply.github.com"
          git add -A probe; git commit -qm "probe sonuçları" || true; git push -q
