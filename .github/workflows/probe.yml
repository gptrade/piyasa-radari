name: probe-saglik
# Geçici sağlık kontrolü (arastirma-saglik dalı). İş bitince dal silinir.
on:
  push:
    branches: [arastirma-saglik]
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: SPK ve BIST duyuru kaynaklarını yokla
        env:
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
        run: |
          mkdir -p probe
          pip install -q -r requirements.txt
          python - > probe/log4.txt 2>&1 <<'PY' || true
          import os, requests
          key = os.environ.get("EVDS_API_KEY")
          base = "https://evds3.tcmb.gov.tr/igmevdsms-dis/"
          for g in ["bie_pkauo", "bie_enfbek"]:
              r = requests.get(base + f"serieList/type=json&code={g}", headers={"key": key}, timeout=40)
              for x in r.json():
                  n = x.get("SERIE_NAME", "")
                  if any(w in n for w in ("12 Ay", "Yıllık", "Yıl Sonu", "24 Ay")):
                      print(g, x["SERIE_CODE"], "|", n, "|", x.get("START_DATE"), x.get("END_DATE"))
          PY
      - name: kaydet
        if: always()
        run: |
          git config user.name "Gursah"; git config user.email "gptrade@users.noreply.github.com"
          git add -A probe; git commit -qm "probe sonuçları" || true; git push -q
