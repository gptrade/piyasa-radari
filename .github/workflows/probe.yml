name: probe-bist  # p17
on:
  push:
    branches: [arastirma-bist-veri]
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/checkout@v4
        with: { ref: onizleme-gizli-raporlar, path: app }
      - name: gizli rapor kutusunu çek
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: gptrade/piyasa-radari-raporlar
          token: ${{ secrets.RAPOR_REPO_TOKEN }}
          path: _raporlar
          persist-credentials: false
      - name: gizli rapor kuru çalıştırma
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.PIYASA_RADARI }}
        run: |
          set +e
          mkdir -p probe17
          pip install -q -r app/requirements.txt
          python probe17.py > probe17/sonuc.txt 2>&1 || true
          rm -rf _raporlar
      - name: kaydet
        if: always()
        run: |
          git config user.name "Gursah"; git config user.email "gptrade@users.noreply.github.com"
          git add -A probe17; git commit -qm "probe17 sonuçları" || true; git push -q
