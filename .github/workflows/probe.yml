name: probe-saglik
# Geçici sağlık kontrolü (arastirma-saglik dalı). İş bitince dal silinir.
on:
  push:
    branches: [arastirma-saglik]
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Regülasyon alternatif kanallar 2
        run: |
          mkdir -p probe
          pip install -q -r requirements.txt
          python - > probe/log15.txt 2>&1 <<'PY' || true
          import re
          from urllib.parse import quote_plus
          from radar.regwatch import Fetcher
          f = Fetcher()
          for q in ["site:cbb.gov.bh", "site:boi.org.il", "site:bdl.gov.lb", "site:cbo.gov.om", "site:cbar.az", "site:centralbank.ae"]:
              for hl in ("hl=en-US&gl=US&ceid=US:en",):
                  u = f"https://news.google.com/rss/search?q={quote_plus(q)}+when:120d&{hl}"
                  r = f.s.get(u, timeout=30)
                  items = re.findall(r"<item>.*?<title>(.*?)</title>.*?<pubDate>(.*?)</pubDate>", r.text, re.S)
                  print("GNEWS", q, len(items), [(t[:80], d[5:16]) for t, d in items[:6]])
          for u in ["https://cbben.thomsonreuters.com/sitemap.xml", "https://cbben.thomsonreuters.com/rulebook/whats-new", "https://cbben.thomsonreuters.com/latest-updates"]:
              r = f.s.get(u, timeout=30); print("CBBRB", u, r.status_code, len(r.text), re.sub(r"\s+"," ",r.text[:200]))
          r = f.s.get("https://cbben.thomsonreuters.com/", timeout=30)
          links = sorted(set(re.findall(r'href="(/[^"#?]{3,80})"', r.text)))
          print("CBBRB linkler", len(links), links[:60])
          r = f.s.get("https://www.abl.org.lb/", timeout=30)
          print("ABL linkler", sorted(set(l for l in re.findall(r'href="([^"]+)"', r.text) if "circ" in l.lower() or "تعاميم" in l or "bdl" in l.lower()))[:20])
          PY

      - name: kaydet
        if: always()
        run: |
          git config user.name "Gursah"; git config user.email "gptrade@users.noreply.github.com"
          git add -A probe; git commit -qm "probe sonuçları" || true; git push -q
