name: probe-saglik
# Geçici sağlık kontrolü (arastirma-saglik dalı). İş bitince dal silinir.
on:
  push:
    branches: [arastirma-saglik]
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: KAP fiili dolasim
        run: |
          mkdir -p probe
          pip install -q requests
          python - > probe/log23.txt 2>&1 <<'PY' || true
          import re, requests, io
          UA = {"User-Agent": "Mozilla/5.0 (compatible; LyraRadar/1.0; kisisel kullanim)"}
          g = lambda u, **k: requests.get(u, headers=UA, timeout=40, **k)
          try:
              from pypdf import PdfReader
          except ImportError:
              import subprocess; subprocess.run(["pip", "install", "-q", "pypdf"]); from pypdf import PdfReader
          try:
              r = g("https://www.vap.org.tr/sites/default/files/2026-09/telif-hakki-ve-cekince-ihbari.pdf")
              print("TELIF", r.status_code); print("\n".join(p.extract_text() for p in PdfReader(io.BytesIO(r.content)).pages)[:4000])
          except Exception as e: print("telif hata", e)
          r = g("https://www.kap.org.tr/tr/sirket-bilgileri/ozet/2428-turkiye-vakiflar-bankasi-t-a-o"); t = r.text.replace('\\"', '"')
          for k in ["actualOutstandingSharesRatio", "actualSharesOutstanding"]:
              for m in list(re.finditer(k, t))[:6]: print(k, "|", t[max(0, m.start()-250): m.end()+120].replace("\n", " "))
          print("---- oid ile")
          for u in ["https://www.kap.org.tr/tr/sirket-bilgileri/ozet/4028e4a140f2ed720140f37cb2a601b7", "https://www.kap.org.tr/tr/sirket-bilgileri/ozet/2428"]:
              try:
                  r = g(u, allow_redirects=True); print(u, r.status_code, r.url, len(r.text), "actualOutstandingSharesRatio" in r.text)
              except Exception as e: print(u, "hata", e)
          r = g("https://www.kap.org.tr/tr/bist-sirketler"); t = r.text.replace('\\"', '"')
          links = re.findall(r'/tr/sirket-bilgileri/ozet/(\d+)-([a-z0-9-]+)', t); print("bist-sirketler link", len(links), len(set(links)), links[:3])
          m = re.search(r'.{300}VAKBN.{300}', t); print(m.group(0) if m else None)
          PY

      - name: kaydet
        if: always()
        run: |
          git config user.name "Gursah"; git config user.email "gptrade@users.noreply.github.com"
          git add -A probe; git commit -qm "probe sonuçları" || true; git push -q
