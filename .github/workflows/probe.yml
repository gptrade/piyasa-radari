name: probe-saglik
# Geçici sağlık kontrolü (arastirma-saglik dalı). İş bitince dal silinir.
on:
  push:
    branches: [arastirma-saglik]
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: CBO AIA
        run: |
          mkdir -p probe
          pip install -q -r requirements.txt
          python - > probe/log9.txt 2>&1 <<'PY' || true
          import logging, ssl, socket
          logging.basicConfig(level=logging.INFO)
          from radar.regwatch import Fetcher
          f = Fetcher()
          for u in ["https://cbo.gov.om/Pages/Circulars.aspx"]:
              r = f.get(u); print("fetcher", None if r is None else (r.status_code, len(r.text)))
          from aia import AIASession
          try:
              s = AIASession(); chain = s.aia_chase("cbo.gov.om") if hasattr(s, "aia_chase") else None
              print("chase", [c.get_subject() for c in chain] if chain else chain)
          except Exception as e: print("chase hata", repr(e)[:400])
          try:
              print("cadata", len(s.cadata_from_url("https://cbo.gov.om/")))
          except Exception as e: print("cadata hata", repr(e)[:400])
          ctx = ssl.create_default_context(); ctx.check_hostname = False; ctx.verify_mode = ssl.CERT_NONE
          with socket.create_connection(("cbo.gov.om", 443), timeout=20) as so:
              with ctx.wrap_socket(so, server_hostname="cbo.gov.om") as ss:
                  from cryptography import x509
                  c = x509.load_der_x509_certificate(ss.getpeercert(True))
                  print("leaf", c.subject.rfc4514_string(), "| issuer", c.issuer.rfc4514_string(), c.not_valid_after_utc)
                  try:
                      print("aia ext", c.extensions.get_extension_for_class(x509.AuthorityInformationAccess).value)
                  except Exception as e: print("aia ext yok", e)
          PY

      - name: kaydet
        if: always()
        run: |
          git config user.name "Gursah"; git config user.email "gptrade@users.noreply.github.com"
          git add -A probe; git commit -qm "probe sonuçları" || true; git push -q
