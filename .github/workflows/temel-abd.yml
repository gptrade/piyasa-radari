name: temel-abd

# ABD temel analiz: S&P 500 + Nasdaq-100 + Dow 30, SEC EDGAR XBRL (companyfacts). Her gün ABD kapanışından sonra (hafta sonu yalnız tarama özeti yenilenir).
# İlk çalıştırma tüm evreni indirir (~520 şirket); sonra yalnız yeni 10-Q/10-K verenler ve 30 günü geçenler.
# Veri ayrı `fin_us` dalında; radar iş akışı yalnız _screen.json'u yayımlar.
on:
  schedule:
    - cron: "17 23 * * *"
  workflow_dispatch: {}
  push:
    branches: [onizleme-abd]
    paths: [".github/workflows/temel-abd.yml", "radar/fundamentals/us.py"]

permissions:
  contents: write

concurrency:
  group: temel-abd
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Önceki veriyi geri yükle
        run: |
          mkdir -p site/data/fin_us
          if git ls-remote --exit-code --heads origin fin_us >/dev/null 2>&1; then
            git fetch --depth 1 origin fin_us
            git archive FETCH_HEAD | tar -x -C site/data/fin_us
          fi
          # piyasa değeri ve momentum: ABD ısı haritası (data dalı)
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --depth 1 origin data
            git archive FETCH_HEAD us_map.json us_shares.json | tar -x -C site/data || git archive FETCH_HEAD us_map.json | tar -x -C site/data || true
          fi

      - name: ABD temel analiz verisi
        timeout-minutes: 32
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python -m radar.fundamentals.us 600

      - name: Veriyi fin_us dalına kaydet
        if: always()
        run: |
          cd site/data/fin_us
          [ -f _state.json ] || exit 0
          git init -q -b fin_us
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add -A
          git commit -qm "fin_us $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" fin_us
          rm -rf .git
