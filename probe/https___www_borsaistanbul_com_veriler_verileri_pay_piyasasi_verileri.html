<!DOCTYPE html>
<html lang="tr">
   <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Sayfa Bulunamadı</title>
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
   </head>
   <style>
      :root {
      --bs-gutter-x: 1.875rem;
      --bs-gutter-y: 0;
      }
      @media (min-width: 576px) {
      .container { max-width: 540px; }
      }
      @media (min-width: 768px) {
      .container { max-width: 720px; }
      }
      @media (min-width: 992px) {
      .container { max-width: 960px; }
      }
      @media (min-width: 1320px) {
      .container { max-width: 1320px; }
      }
      @media (min-width: 1500px) {
      .container { max-width: 1500px; }
      }
      @media only screen and (max-width: 1500px) {
      .container {
      width: calc(100% - 50px) !important;
      max-width: calc(100% - 50px) !important;
      margin-left: 25px;
      margin-right: 25px;
      }
      }
      @media only screen and (max-width: 576px) {
      .container {
      width: 100% !important;
      max-width: 100% !important;
      margin-left: 0 !important;
      margin-right: 0 !important;
      }
      }
      .row {
      display: flex;
      flex-wrap: wrap;
      box-sizing: border-box;
      margin-top: var(--bs-gutter-y);
      margin-right: calc(var(--bs-gutter-x) * -0.5);
      margin-left: calc(var(--bs-gutter-x) * -0.5);
      }
      .container {
      width: 100%;
      margin-left: auto;
      margin-right: auto;
      padding-right: calc(var(--bs-gutter-x) * 0.5);
      padding-left: calc(var(--bs-gutter-x) * 0.5);
      box-sizing: border-box;
      }
      .col-6 {
      flex: 0 0 auto;
      width: 50%;
      box-sizing: border-box;
      padding-left: calc(var(--bs-gutter-x) * 0.5);
      padding-right: calc(var(--bs-gutter-x) * 0.5);
      }
      @media (min-width: 576px) {
      .col-sm {
      flex: 1 0 0;
      }
      }
      html,body{
      overflow-x: hidden;
      }
      body {
      background: url(https://borsaistanbul.com/themes/custom/borsaistanbul/images/bg.jpeg) no-repeat;
      background-size: cover;
      background-position: center center;
      background-attachment: scroll;
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', sans-serif;
      }
      p{
      margin: 0;
      line-height: 1.5;
      }
      a{
      text-decoration: none;
      }
      hr{
      color: rgba(0, 0, 0, 0.1);
      border: 0;
      margin: 1rem 0;
      border: 0;
      height: 2px;
      background-color: rgba(255, 255, 255, 0.1);
      }
      .text-blue {
      color: #009fc3;
      }
      .large-text {
      font-size: 112px;
      color: #48555d;
      }
      .text-gray{
      color: #48555d;
      }
      p.text-blue{
      font-weight: bold;
      }
      p.not-found{
      margin-top: 1.74rem;
      margin-bottom: 1rem;
      }
      header{
      background-color: white;
      height: 90px;
      display: flex;
      align-items: center;
      z-index: 10;
      position: relative;
      }
      .page-title-wrapper {
      position: relative;
      min-height: 250px;
      background: linear-gradient(0deg, #051c33 0%, #052546 100%);
      display: flex;
      }
      .page-title-wrapper img {
      opacity: 0.25;
      height: 100%;
      width: 100%;
      position: absolute;
      }
      .page-title-wrapper .container {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      z-index: 1;
      color: white;
      }
      .basic-page-main {
      display: flex;
      position: relative;
      margin-top: -50px;
      margin-bottom: 120px;
      position: relative;
      padding: 45px;
      -webkit-border-radius: 10px;
      -moz-border-radius: 10px;
      border-radius: 10px;
      background-color: white;
      overflow: hidden;
      -webkit-box-shadow: 0px 0px 40px 0px rgba(15, 88, 105, 0.06);
      -moz-box-shadow: 0px 0px 40px 0px rgba(15,88,105,0.06);
      box-shadow: 0px 0px 40px 0px rgba(15, 88, 105, 0.06);
      }
      footer{
      padding-top: 1.5rem !important;
      padding-bottom: 1.5rem !important;
      background-color: #041c2f !important;
      }
      .footer-sponsor {
      -webkit-transition: all 500ms;
      -moz-transition: all 500ms;
      -o-transition: all 500ms;
      transition: all 500ms;
      background-color: rgba(255, 255, 255, 0.1);
      -webkit-border-radius: 10px;
      -moz-border-radius: 10px;
      border-radius: 10px;
      height: 140px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.5rem !important;
      }
      .footer-sponsor:hover{
      background-color: rgba(255, 255, 255, 0.15);
      }
      @media (max-width: 991.98px) {
      .sponsor-list .footer-sponsor img {
      max-width: 80%;
      }
      }
      footer img{
      width: 100%;
      height: auto;
      }
      .sponsor-list{
      padding-bottom: 14px;
      }
      @media (max-width: 575.98px) {
      .sponsor-list .col-sm:nth-last-child(n+3) {
      margin-bottom: 1.875rem;
      }
      }
      @media (max-width: 767.98px) {
      .basic-page-main {
      padding: 1.5rem !important;
      }
      } 
   </style>
   <body>
      <header>
         <div class="container">
            <a href="https://borsaistanbul.com" rel="home" title="Ana Sayfa">
            <img src="https://borsaistanbul.com/themes/custom/borsaistanbul/logo.png" alt="Ana Sayfa" width="161" height="60">
            </a>
         </div>
      </header>
      <div class="page-title-wrapper">
         <img src="https://www.borsaistanbul.com/themes/custom/borsaistanbul/images/subpage-topimage.jpg" alt="cover-img">
         <div class="container">
            <div>
               <h1>Sayfa bulunamadı</h1>
            </div>
         </div>
      </div>
      <main class="container">
         <div class="basic-page-main">
            <div class="content">
               <p class="text-blue">Hata</p>
               <p class="large-text">404</p>
               <p class="text-blue  not-found">Aradığınız sayfa bulunamadı!</p>
               <p class="text-gray"> Ana Sayfaya dönmek için <a href="https://borsaistanbul.com" class="text-blue">tıklayınız.</a></p>
            </div>
         </div>
      </main>
      <footer>
         <div class="container">
            <div class="sponsor-list row">
               <div class="col-6 col-sm">
                  <div class="footer-sponsor">
                     <a target="_blank" href="https://datastore.borsaistanbul.com/" class="stretched-link"> 
                      <img loading="lazy" src="https://borsaistanbul.com//file/styles/sponsor_logo/public/2024-05/banner_1.png.webp?itok=mo0PT1Xg" width="180" height="46" alt="Data Store"> </a>
                  </div>
               </div>
               <div class="col-6 col-sm">
                  <div class="footer-sponsor">
                     <a target="_blank" href="https://www.bistozelpazar.com/OzelPazar/app/main?execution=e1s1" class="stretched-link"> 
                      <img loading="lazy" src="https://borsaistanbul.com/file/styles/sponsor_logo/public/2024-05/banner_7.png.webp?itok=998ag5h2" width="187" height="75" alt="Borsa İstanbul Özel Pazar"> </a>
                  </div>
               </div>
               <div class="col-6 col-sm">
                  <div class="footer-sponsor">
                     <a target="_blank" href="https://www.takasbank.com.tr/tr" class="stretched-link"> 
                      <img loading="lazy" src="https://borsaistanbul.com/file/styles/sponsor_logo/public/2024-05/banner_68.png.webp?itok=Ot41GN0b" width="185" height="75" alt="Takas İstanbul"> </a>
                  </div>
               </div>
               <div class="col-6 col-sm">
                  <div class="footer-sponsor">
                     <a target="_blank" href="https://www.mkk.com.tr/" class="stretched-link"> 
                      <img loading="lazy" src="https://borsaistanbul.com/file/styles/sponsor_logo/public/2024-05/banner_2.png.webp?itok=l97kjkup" width="185" height="57" alt="Merkezi Kayıt İstanbul"> </a>
                  </div>
               </div>
            </div>
            <hr class="footer-hr">
         </div>
      </footer>
   </body>
</html>
